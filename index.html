<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: mesa de dibujo — barra lateral carbón tipo carátula, área de trabajo sobre papel milimetrado, columnas como hojas. Misma familia visual que ObraSys. */
:root{
  --paper:#ECEEEC; --sheet:#FFFFFF; --colbg:#F5F6F4; --ink:#16191B; --ink2:#4A5257; --ink3:#7C858A;
  --line:#D6DBD9; --line2:#E6E9E7; --grid:rgba(31,94,91,.06);
  --band:#1E2326; --bandfg:#EEF0EE; --bandline:rgba(255,255,255,.12); --bandhover:rgba(255,255,255,.06); --bandsel:rgba(255,255,255,.12);
  --accent:#1F5E5B; --accent2:#2D7D78; --accentbg:#E1EDEB; --tape:#F2B705; --tapebg:#FFF3C7; --tapefg:#1E2326;
  --ok:#2E7D4F; --okbg:#E0F1E6; --warn:#9A5D00; --warnbg:#FCEDD3; --bad:#B3261E; --badbg:#FBE3E0;
  --st-todo:#7C858A; --st-doing:#2D7D78; --st-review:#D49A00; --st-done:#2E7D4F;
  --c0:#1F5E5B; --c1:#B8641A; --c2:#3E5C9A; --c3:#8A4F7D; --c4:#5C7A2C; --c5:#B3443A; --c6:#2B7A91; --c7:#6B6258;
  --avfg:#FFFFFF;
  --shadow:0 1px 1px rgba(22,25,27,.04),0 2px 6px rgba(22,25,27,.05);
  --lift:0 18px 40px rgba(22,25,27,.28);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --side:252px; --colw:292px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:23px;font-weight:800} h2{font-size:18px;font-weight:750} h3{font-size:14px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;font-weight:700;color:var(--ink3)}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.ic{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--band);color:var(--bandfg);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px}
.brand{display:grid;gap:12px;padding:2px 8px 16px;border-bottom:1px solid var(--bandline)}
.brand img{width:128px;height:auto;display:block}
.brand .sys{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.brand span{font-size:11px;opacity:.6}
.nav{display:grid;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;opacity:.78;width:100%}
.nav button:hover{opacity:1;background:var(--bandhover)}
.nav button[aria-current="page"]{opacity:1;background:var(--bandsel);box-shadow:inset 3px 0 0 var(--tape)}
.nav button:focus-visible{outline:2px solid var(--tape)}
.nav .ic{width:18px;height:18px}
.nav .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.65}
.side-sec{display:grid;gap:1px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px;font-family:var(--f-display);font-stretch:78%;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;opacity:.55;font-weight:700}
.side-h button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;opacity:1}
.side-h button:hover{background:var(--bandhover)}
.pitem{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;opacity:.82;user-select:none;-webkit-user-select:none}
.pitem:hover{background:var(--bandhover);opacity:1}
.pitem[aria-current="page"]{background:var(--bandsel);opacity:1}
.pitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .cd{font-family:var(--f-mono);font-size:10.5px;opacity:.55}
.pitem .k{font-family:var(--f-mono);font-size:11px;opacity:.6}
.pitem.drop-on{background:var(--tape);color:var(--tapefg);opacity:1}
.sw{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none;display:inline-block}
.side-empty{padding:4px 10px;font-size:12px;opacity:.55}
.me-box{margin-top:auto;border-top:1px solid var(--bandline);padding:12px 8px 0;display:flex;gap:10px;align-items:center;font-size:12.5px}
.me-box .who{flex:1;min-width:0;display:grid}
.me-box .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box .who span{opacity:.6;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box button{all:unset;cursor:pointer;font-size:11.5px;opacity:.7;text-decoration:underline;text-underline-offset:2px}

.main{min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .mk{display:none;width:30px;height:30px;border-radius:7px}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .me-mini{display:none}
.search{display:flex;align-items:center;gap:7px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:250px;color:var(--ink3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0;flex:1}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--tapebg);color:var(--ink);border:1px dashed var(--tape);font-size:13px}
.banner b{font-weight:600}
.banner.ro{background:var(--accentbg);border-color:var(--accent)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tapefg);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;min-height:28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.inp{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 9px;min-width:0;width:100%;min-height:36px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accentbg)}
textarea.inp{resize:vertical;line-height:1.45}
.fld{display:grid;gap:5px;font-size:12px;color:var(--ink2);min-width:0}
.fld>span{font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;background:var(--sheet)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;background:var(--pc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* avatars & chips */
.av{width:24px;height:24px;border-radius:50%;background:var(--ac,var(--c7));color:var(--avfg);display:inline-grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-display);font-stretch:85%;letter-spacing:.04em;flex:none;line-height:1}
.av.lg{width:34px;height:34px;font-size:12.5px}
.av.none{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2);max-width:100%;min-width:0}
.chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.tag{font-size:10.5px;font-family:var(--f-display);font-stretch:82%;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--ink3);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:2px 24px 18px;margin-inline:-24px;align-items:flex-start;scroll-snap-type:x proximity;scroll-padding-inline:24px;min-height:50vh;overscroll-behavior-x:contain}
.col{flex:0 0 var(--colw);background:var(--colbg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;scroll-snap-align:start;min-width:0;transition:border-color .12s,box-shadow .12s}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;min-width:0}
.col-h h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .who{display:grid;min-width:0;flex:1}
.col-h .n{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:auto}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--stc)}
.col-list{display:flex;flex-direction:column;gap:8px;padding:2px 8px 8px;min-height:52px}
.col-empty{border:1.5px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;font-size:12px;color:var(--ink3)}
.col.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.col-more{font-size:12px;color:var(--ink3);padding:0 12px 10px}
.quick{padding:0 8px 8px;display:grid;gap:6px}
.quick>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;color:var(--ink2);font-size:13px}
.quick>button:hover{background:var(--line2);color:var(--ink)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 11px 9px;display:grid;gap:7px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.card:hover{border-color:var(--ink3)}
.card.dragging{opacity:.28}
.card .meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;min-width:0}
.ttl{display:flex;gap:8px;align-items:flex-start;min-width:0}
.ttl .t{font-size:13.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.chk{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;box-sizing:border-box}
.chk .ic{width:12px;height:12px}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.chk.lg{width:24px;height:24px}
.chk.lg .ic{width:15px;height:15px}
.card.done .t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);min-height:22px}
.due{font-family:var(--f-mono);font-size:11px;display:inline-flex;gap:4px;align-items:center;padding:1px 6px;border-radius:4px;background:var(--line2);white-space:nowrap}
.due .ic{width:12px;height:12px}
.due.over{background:var(--badbg);color:var(--bad)} .due.today{background:var(--tapebg);color:var(--warn)}
.prio{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.prio .ic{width:12px;height:12px}
.prio.p1{color:var(--warn)} .prio.p2{color:var(--bad)}
.cl{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px}
.cl .ic{width:13px;height:13px}
.cl.full{color:var(--ok)}
.dim{color:var(--ink3)}

.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;margin:0;box-shadow:var(--lift);border-color:var(--accent);opacity:.97;cursor:grabbing}
.ph{border:2px dashed var(--accent);border-radius:8px;background:var(--accentbg);flex:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging .card:hover{border-color:var(--line)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:250;background:var(--band);color:var(--bandfg);border-radius:14px;padding:10px 12px;display:grid;gap:8px;width:min(760px,calc(100vw - 24px));box-shadow:var(--lift)}
.dock-row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.dock-row::-webkit-scrollbar{display:none}
.dock .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.6;font-family:var(--f-display);font-stretch:80%;font-weight:700;white-space:nowrap;min-width:64px}
.dk{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--bandsel);font-size:12.5px;white-space:nowrap;flex:none;transition:background .1s,transform .1s}
.dk.proj{padding-left:10px}
.dk.drop-on{background:var(--tape);color:var(--tapefg);transform:scale(1.06)}

/* tiles */
.hello{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hello .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}

.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h .sp{flex:1}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.pcard:hover{border-color:var(--ink3)}
.pcard.dragging{opacity:.3}
.pcard.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.pcard.arch{opacity:.6}
.pcard .hd{display:flex;gap:10px;align-items:flex-start}
.pcard .hd .nm{flex:1;min-width:0;display:grid;gap:2px}
.pcard h3{font-size:16px;overflow-wrap:anywhere}
.pcard .cli{font-size:12px;color:var(--ink3)}
.stamp{border:1.5px solid var(--ink);padding:2px 6px;font-family:var(--f-mono);font-size:11px;line-height:1.2;text-align:center;display:grid;flex:none;border-radius:2px}
.stamp small{font-family:var(--f-display);font-stretch:80%;font-size:9px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);margin:0 -6px 2px;padding:0 6px 1px}
.meter{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:3px}
.pcard .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.avs{display:flex}
.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--sheet)}
.avs .av:first-child{margin-left:0}

function dueInfo(t){ if(!t.due) return null; const d=dayDiff(t.due,TODAY());
  const c=t.status==="done"?"":d<0?"over":d===0?"today":"";
  const l=d===0?"Hoy":d===1?"Mañana":d===-1?"Ayer":fmtD(t.due); return {c,l,d}; }

/* ---------- escritura (Supabase) ---------- */
let sb=null;
const KM={
  members:{name:"name",role:"role",color:"color",email:"email",isAdmin:"is_admin",order:"sort_order",uid:"user_id"},
  projects:{name:"name",kind:"kind",code:"code",client:"client",place:"place",color:"color",archived:"archived",order:"sort_order",team:"team",lead:"lead",createdBy:"created_by",createdAt:"created_at"},
  tasks:{title:"title",notes:"notes",projectId:"project_id",assigneeId:"assignee_id",status:"status",prio:"prio",due:"due",etapa:"etapa",checklist:"checklist",order:"sort_order",createdBy:"created_by",createdAt:"created_at",updatedAt:"updated_at",doneAt:"done_at"}};
const NULLABLE=new Set(["project_id","assignee_id","lead","created_by","user_id","due"]);
const TSC=new Set(["done_at","updated_at","created_at"]);
const EMPTYSTR=new Set(["projectId","assigneeId","lead","due","createdBy","uid"]);
function toDb(coll,o){ const r={}; for(const [k,v] of Object.entries(o)){ const c=KM[coll][k]; if(!c) continue; let x=v;
  if(NULLABLE.has(c)&&(x===""||x===undefined)) x=null; if(TSC.has(c)) x=x?new Date(x).toISOString():null;
  if(c==="email"&&x) x=String(x).trim().toLowerCase(); r[c]=x; } return r; }
function fromDb(coll,r){ const o={id:r.id}; for(const [k,c] of Object.entries(KM[coll])){ let v=r[c]; if(TSC.has(c)) v=v?Date.parse(v):null; if(v==null&&EMPTYSTR.has(k)) v=""; o[k]=v; } return o; }
function fromHist(r){ return {...(r.data||{}),id:r.id,ts:Date.parse(r.ts),actor:r.actor||"",actorName:r.actor_name||"",type:r.type,taskId:r.task_id||"",title:r.title||"",projectId:r.project_id||""}; }
const chains={};
function dbw(key,fn){ const p=(chains[key]||Promise.resolve()).then(async()=>{ const {error}=await fn(); if(error) throw error; }).catch(onErr); chains[key]=p; return p; }
function onErr(e){ console.warn(e); const c=e&&(e.code||"");
  if(c==="42501"||/row-level security|permission denied/i.test(e&&e.message||"")){ toast("No tenés permiso para hacer ese cambio."); resync(); }
  else if(/fetch|network|Failed/i.test(e&&e.message||"")) toast("Sin conexión. El cambio no se guardó; revisá internet y volvé a intentar.");
  else { toast("No se pudo guardar el cambio. Volvé a intentar."); resync(); }
}
function put(coll,id,obj){ DATA()[coll][id]={...obj,id}; dbw(coll+"/"+id,()=>sb.from(coll).insert({id,...toDb(coll,obj)})); }
function patch(coll,id,p){ const cur=DATA()[coll][id]; if(!cur) return; DATA()[coll][id]={...cur,...p}; const row=toDb(coll,p); if(!Object.keys(row).length) return; dbw(coll+"/"+id,()=>sb.from(coll).update(row).eq("id",id)); }
function del(coll,id){ delete DATA()[coll][id]; dbw(coll+"/"+id,()=>sb.from(coll).delete().eq("id",id)); }
function log(type,o={}){ const {taskId,title,projectId,...rest}=o; const cid=rid();
  const e={ts:Date.now(),actor:S.meId||"",actorName:mName(S.meId),type,...o,cid,id:"tmp-"+cid};
  DATA().history.unshift(e);
  dbw("history",()=>sb.from("history").insert({actor:S.meId||null,actor_name:mName(S.meId),type,task_id:taskId||null,title:title||"",project_id:projectId||null,data:{...rest,cid}})); }
const canEdit=()=>S.canWrite;

/* ---------- operaciones de tareas ---------- */
function createTask(o){
  if(!canEdit()) return toast("Tenés acceso de solo lectura.");
  const id=rid(); const t={title:o.title.trim(),notes:o.notes||"",projectId:o.projectId||"",assigneeId:o.assigneeId??(S.meId||""),
    status:o.status||"todo",prio:+o.prio||0,due:o.due||"",etapa:o.etapa||"",checklist:[],order:Date.now(),
    createdBy:S.meId||"",createdAt:Date.now(),updatedAt:Date.now(),doneAt:o.status==="done"?Date.now():null};
  put("tasks",id,t);
  const p=DATA().projects[t.projectId];
  log("create",{taskId:id,title:t.title,projectId:t.projectId,pname:p?p.name:"",to:t.assigneeId,toName:mName(t.assigneeId)});
  if(t.assigneeId&&t.assigneeId!==S.meId) setTimeout(()=>offerNotify(id),400);
  return id;
}
function moveTask(id,ch,quiet){
  if(!canEdit()){ toast("Tenés acceso de solo lectura."); return; }
  const t=DATA().tasks[id]; if(!t) return; const p={}; const D=DATA(); const base={taskId:id,title:t.title,projectId:t.projectId,pname:(D.projects[t.projectId]||{}).name||""};
  const msgs=[];
  if(ch.status!==undefined&&ch.status!==t.status){ p.status=ch.status; p.doneAt=ch.status==="done"?Date.now():null;
    const type=ch.status==="done"?"done":t.status==="done"?"reopen":"status";
    log(type,{...base,from:t.status,to:ch.status}); msgs.push(ch.status==="done"?"Tarea terminada":"Movida a "+SN[ch.status]); }
  if(ch.assigneeId!==undefined&&ch.assigneeId!==t.assigneeId){ p.assigneeId=ch.assigneeId;
    log("assign",{...base,from:t.assigneeId,fromName:mName(t.assigneeId),to:ch.assigneeId,toName:mName(ch.assigneeId)});
    msgs.push(ch.assigneeId?"Asignada a "+first(mName(ch.assigneeId)):"Sin responsable");
    if(ch.assigneeId&&ch.assigneeId!==S.meId) setTimeout(()=>offerNotify(id),400); }
  if(ch.projectId!==undefined&&ch.projectId!==t.projectId){ p.projectId=ch.projectId; const np=D.projects[ch.projectId];
    log("project",{...base,from:t.projectId,fromName:base.pname,to:ch.projectId,toName:np?np.name:""}); msgs.push("Movida a "+(np?np.name:"sin tablero")); }
  if(ch.due!==undefined&&ch.due!==t.due){ p.due=ch.due; log("due",{...base,from:t.due,to:ch.due}); msgs.push(ch.due?"Vence el "+fmtD(ch.due):"Sin fecha"); }
  if(ch.order!==undefined&&ch.order!==t.order) p.order=ch.order;
  if(!Object.keys(p).length) return;
  p.updatedAt=Date.now(); patch("tasks",id,p);
  if(!quiet&&msgs.length) toast(msgs.join(" · "));
}
function editTask(id,p,what){ if(!canEdit()) return toast("Tenés acceso de solo lectura."); const t=DATA().tasks[id]; if(!t) return;
  patch("tasks",id,{...p,updatedAt:Date.now()}); if(what) log("edit",{taskId:id,title:p.title||t.title,projectId:t.projectId,what}); }
function deleteTask(id){ if(!canEdit()) return; const t=DATA().tasks[id]; if(!t) return; log("delete",{taskId:id,title:t.title,projectId:t.projectId,pname:(DATA().projects[t.projectId]||{}).name||""}); del("tasks",id); toast("Tarea eliminada"); }

let nT;
function hideNotify(){ const n=$("#notify"); n.hidden=true; n.innerHTML=""; clearTimeout(nT); }
function offerNotify(id){
  const t=DATA().tasks[id]; if(!t) return; const m=DATA().members[t.assigneeId]; if(!m) return;
  const n=$("#notify");
  n.innerHTML=m.email?`${avHTML(m)}<span class="tx">¿Avisar a <b>${esc(first(m.name))}</b> por mail sobre esta tarea?</span><button class="btn ghost sm" data-act="notifyNo">No</button><button class="btn pri sm" data-act="notifySend" data-id="${esc(id)}">Enviar aviso</button>`
    :`${avHTML(m)}<span class="tx"><b>${esc(first(m.name))}</b> no tiene mail cargado para recibir avisos.</span><button class="btn ghost sm" data-act="notifyNo">Ahora no</button>${canEdit()?`<button class="btn sm" data-act="memEditClose" data-mid="${esc(m.id)}">Cargar mail</button>`:""}`;
  n.hidden=false; clearTimeout(nT); nT=setTimeout(hideNotify,15000);
}
function mailContent(t){
  const D=DATA(), p=D.projects[t.projectId], m=D.members[t.assigneeId], by=mName(S.meId)||"Alguien del estudio";
  const board=p?(p.code?p.code+" · ":"")+p.name:"Sin tablero"; const due=t.due?longD(t.due):"Sin fecha"; const link=taskLink(t.id);

  const htmlBody=`<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#16191B">
<div style="background:#1E2326;color:#EEF0EE;padding:14px 20px;border-radius:10px 10px 0 0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:bold">Gabinete · Pérez Ramírez Arquitectura</div>
<div style="border:1px solid #D6DBD9;border-top:0;border-radius:0 0 10px 10px;padding:20px">
<p style="margin:0 0 6px;font-size:14px">Hola ${esc(first(m&&m.name))},</p>
<p style="margin:0 0 16px;font-size:14px">${esc(by)} te asignó una tarea:</p>
<p style="margin:0 0 14px;font-size:19px;font-weight:bold">${esc(t.title)}</p>
<table style="border-collapse:collapse;margin:0 0 18px">${row("Tablero",board)}${row("Estado",SN[t.status])}${row("Vence",due)}${row("Prioridad",PRIO[t.prio||0])}${t.notes?row("Notas",t.notes.slice(0,400)):""}</table>
<a href="${link}" style="display:inline-block;background:#1F5E5B;color:#FFFFFF;text-decoration:none;padding:11px 18px;border-radius:7px;font-size:14px;font-weight:bold">Abrir la tarea</a>
<span style="display:inline-block;width:10px"></span><a href="${APP_URL}" style="color:#1F5E5B;font-size:14px">Ir al sistema</a>
<p style="margin:18px 0 0;font-size:12px;color:#7C858A">Entrá con tu cuenta de Claude del estudio. Funciona desde la computadora y el celular.</p></div></div>`;
  return {subject,body,htmlBody};
}
async function sendNotify(id){
  hideNotify();
  const t=DATA().tasks[id]; if(!t) return; const m=DATA().members[t.assigneeId];
  if(!m) return toast("La tarea no tiene responsable.");
  if(!okMail(m.email)) return offerNotify(id);
  const c=mailContent(t);
  if(!NOTIFY_URL) return mailFallback(t,m,c,"Los avisos automáticos todavía no están configurados. Podés copiar el mensaje y mandarlo vos.");
  toast("Enviando aviso a "+first(m.name)+"…");
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(NOTIFY_URL,{method:"POST",body:JSON.stringify({token:session&&session.access_token,taskId:id,app:APP_URL})});
    const j=await r.json().catch(()=>({}));
    if(j&&j.ok){ toast("Aviso enviado a "+m.email); log("notify",{taskId:id,title:t.title,projectId:t.projectId,to:m.id,toName:m.name}); }
    else mailFallback(t,m,c,"No se pudo enviar el aviso automático"+(j&&j.error?": "+j.error:"")+". Podés copiar el mensaje y mandarlo vos.");
  }catch(e){ toast("No se pudo confirmar el envío. Revisá tu conexión antes de volver a intentar."); }
}
function mailFallback(t,m,c,why){
  S.mailCopy=c.subject+"\n\n"+c.body;
  modal(`<div class="sheet-h"><h2>Aviso por mail</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<div class="sheet-b"><p class="banner ro" style="margin:0">${esc(why)}</p>
<div class="mailrow"><span>Para:</span><span class="addr">${esc(m.email)}</span></div>
<div class="mailprev" id="mailPrev">${esc(S.mailCopy)}</div>
<div class="row"><a class="btn ghost sm" href="mailto:${encodeURIComponent(m.email.trim())}?subject=${encodeURIComponent(c.subject)}&body=${encodeURIComponent(c.body)}">Abrir en mi correo</a><span class="sp"></span><button class="btn pri sm" data-act="copyMail">Copiar mensaje</button></div>
<p class="muted small" style="margin:0">Si el botón "Abrir en mi correo" no responde, copiá el mensaje y pegalo en un mail nuevo.</p></div>`,"narrow");
}

function avHTML(m,cls=""){ if(!m) return `<span class="av none ${cls}" title="Sin responsable">${ic("user")}</span>`;
  return `<span class="av ${cls}" style="--ac:var(--c${(m.color||0)%NC})" title="${esc(m.name)}">${esc(initials(m.name))}</span>`; }
function projChip(p){ return `<span class="chip"><i class="sw" style="${pc(p)}"></i><span class="cd">${esc(p.code||"")}</span><span class="cn">${esc(p.name)}</span></span>`; }
function cardHTML(t,o={}){ const D=DATA(), p=D.projects[t.projectId], m=D.members[t.assigneeId];
  const showP=o.showProj!==false&&p, di=dueInfo(t), cl=t.checklist||[], cd=cl.filter(x=>x.d).length, done=t.status==="done";
  return `<article class="card ${done?"done":""}" data-drag="task" data-id="${esc(t.id)}" data-act="openTask" tabindex="0" aria-label="${esc(t.title)}">

<div class="foot">${di?`<span class="due ${di.c}">${ic("clock")}${esc(di.l)}</span>`:""}${t.prio?`<span class="prio p${t.prio}">${ic("flag")}${PRIO[t.prio]}</span>`:""}${cl.length?`<span class="cl ${cd===cl.length?"full":""}">${ic("list")}${cd}/${cl.length}</span>`:""}${t.notes?`<span class="dim" title="Tiene notas">${ic("note")}</span>`:""}<span class="sp"></span>${o.showAv===false?"":`<button class="avbtn who-tag ${m?"":"none"}" data-act="assignPick" data-id="${esc(t.id)}" aria-label="Responsable: ${m?esc(m.name):"sin asignar"}. Tocar para cambiar" title="Cambiar responsable">${avHTML(m)}<span class="an">${m?esc(first(m.name)):"Asignar"}</span></button>`}</div>

function pcardHTML(p){ const ts=tasksL(t=>t.projectId===p.id); const done=ts.filter(t=>t.status==="done").length; const open=ts.length-done;
  const T=TODAY(); const over=ts.filter(t=>t.status!=="done"&&t.due&&t.due<T).length;
  const next=ts.filter(t=>t.status!=="done"&&t.due&&t.due>=T).sort((a,b)=>a.due<b.due?-1:1)[0];

function hSentence(e){ const D=DATA(); const who=`<b>${esc(mName(e.actor)||e.actorName||"Alguien")}</b>`;
  const tt=e.title?(D.tasks[e.taskId]?`<a data-act="openTask" data-id="${esc(e.taskId)}">${esc(e.title)}</a>`:`<span>${esc(e.title)}</span>`):"";
  const pn=id=>esc((D.projects[id]||{}).name||"");
  switch(e.type){
    case "create": return [`new`,"Nueva",`${who} creó ${tt}${e.pname||pn(e.projectId)?` en <b>${esc(e.pname||pn(e.projectId))}</b>`:""}${e.to&&e.to!==e.actor?` para ${esc(mName(e.to)||e.toName)}`:""}`];
    case "status": return ["move","Estado",`${who} movió ${tt} de ${SN[e.from]||e.from} a <b>${SN[e.to]||e.to}</b>`];
    case "done": return ["done","Terminada",`${who} terminó ${tt}`];
    case "reopen": return ["move","Reabierta",`${who} reabrió ${tt} (${SN[e.to]||e.to})`];
    case "assign": return ["move","Asignación",`${who} pasó ${tt} ${e.from?`de ${esc(mName(e.from)||e.fromName||"—")} `:""}a <b>${esc(e.to?(mName(e.to)||e.toName||"—"):"nadie")}</b>`];
    case "project": return ["move","Tablero",`${who} movió ${tt} de ${esc(e.fromName||"sin tablero")} a <b>${esc(e.toName||pn(e.to)||"sin tablero")}</b>`];
    case "due": return ["","Fecha",`${who} cambió el vencimiento de ${tt} a <b>${e.to?esc(fmtD(e.to)):"sin fecha"}</b>`];
    case "edit": return ["","Edición",`${who} editó ${esc(e.what||"")} en ${tt}`];
    case "check": return ["done","Checklist",`${who} completó «${esc(e.item||"")}» en ${tt}`];
    case "delete": return ["del","Eliminada",`${who} eliminó ${tt}${e.pname?` de ${esc(e.pname)}`:""}`];
    case "pcreate": return ["new","Tablero",`${who} creó el tablero <b>${esc(e.pname||"")}</b>`];
    case "pedit": return ["","Tablero",`${who} editó el tablero <b>${esc(e.pname||"")}</b>`];
    case "parch": return ["","Tablero",`${who} ${e.to?"archivó":"reactivó"} el tablero <b>${esc(e.pname||"")}</b>`];
    case "porder": return ["move","Tableros",`${who} reordenó los tableros (${esc(e.pname||"")})`];
    case "pteam": return ["move","Designación",`${who} designó ${e.count||0} ${e.count===1?"persona":"personas"} en <b>${esc(e.pname||pn(e.projectId))}</b>${e.lead?` con ${esc(mName(e.lead)||e.leadName)} como responsable`:""}`];
    case "notify": return ["","Aviso",`${who} avisó por mail a <b>${esc(mName(e.to)||e.toName||"")}</b> sobre ${tt}`];
    case "join": return ["new","Equipo",`${who} se sumó al equipo`];
    case "member": return ["","Equipo",`${who} ${esc(e.what||"actualizó el equipo")}`];
    default: return ["","",`${who} hizo un cambio`];
  }
}

function openQuick(col,refocus){

function quickAdd(col){
  const ta=col.querySelector(".quick textarea"); const v=(ta&&ta.value||"").trim(); if(!v) return;

function closeModal(){ $("#layer").innerHTML=""; S.openTask=null; render(); }
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?"selected":""}>${esc(l)}</option>`;
const projOpts=sel=>opt("","Sin tablero",!sel)+["obra","proyecto"].map(k=>`<optgroup label="${k==="obra"?"Obras":"Proyectos"}">${projectsL(true).filter(p=>(p.kind||"obra")===k).map(p=>opt(p.id,(p.code?p.code+" · ":"")+p.name,p.id===sel)).join("")}</optgroup>`).join("");
const memOpts=(sel,pid)=>{ const p=DATA().projects[pid]; const tm=p?[...new Set([p.lead,...pTeam(p)].filter(Boolean))]:[]; const lab=m=>m.name+(m.id===S.meId?" (vos)":"")+(p&&m.id===p.lead?" · responsable":"");
  if(!tm.length) return opt("","Sin responsable",!sel)+membersL().map(m=>opt(m.id,lab(m),m.id===sel)).join("");
  return opt("","Sin responsable",!sel)+`<optgroup label="Equipo de ${esc(p.name)}">${membersL().filter(m=>tm.includes(m.id)).map(m=>opt(m.id,lab(m),m.id===sel)).join("")}</optgroup><optgroup label="Resto del estudio">${membersL().filter(m=>!tm.includes(m.id)).map(m=>opt(m.id,lab(m),m.id===sel)).join("")}</optgroup>`; };

function taskModal(id){
  const t=DATA().tasks[id]; if(!t){ closeModal(); return; } S.openTask=id; const D=DATA(); const p=D.projects[t.projectId];
  const ro=!canEdit(); const dis=ro?"disabled":"";
  const acts=[...D.history,...S.histOlder].filter(e=>e.taskId===id).slice(0,12);
  const cl=t.checklist||[];
  modal(`<div class="sheet-h"><button class="chk lg ${t.status==="done"?"on":""}" data-act="toggle" data-id="${esc(id)}" aria-label="${t.status==="done"?"Reabrir tarea":"Marcar como terminada"}" ${dis}>${ic("check")}</button>
${p?projChip(p):`<span class="muted small">Sin tablero</span>`}<span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<div class="sheet-b">
<textarea class="inp ttl-inp" id="f-title" data-f="title" rows="1" aria-label="Título" ${dis}>${esc(t.title)}</textarea>
<div class="seg" role="group" aria-label="Estado">${STATUS.map(s=>`<button data-act="setStatus" data-s="${s.k}" aria-pressed="${t.status===s.k}" ${dis}><i class="st" style="--stc:var(--st-${s.k})"></i>${s.n}</button>`).join("")}</div>
<div class="g2">
<label class="fld"><span>Tablero (obra o proyecto)</span><select class="inp" id="f-proj" data-f="projectId" ${dis}>${projOpts(t.projectId)}</select></label>
<label class="fld"><span>Responsable</span><select class="inp" id="f-asg" data-f="assigneeId" ${dis}>${memOpts(t.assigneeId,t.projectId)}</select></label>
<label class="fld"><span>Vence</span><input class="inp" type="date" id="f-due" data-f="due" value="${esc(t.due||"")}" ${dis}></label>
<label class="fld"><span>Prioridad</span><select class="inp" id="f-prio" data-f="prio" ${dis}>${PRIO.map((l,i)=>opt(i,l,(t.prio||0)===i)).join("")}</select></label>
</div>
${!ro&&D.members[t.assigneeId]?`<div class="mailrow">${ic("note")}<span>${D.members[t.assigneeId].email?`Avisar a ${esc(first(D.members[t.assigneeId].name))} (<span class="addr">${esc(D.members[t.assigneeId].email)}</span>)`:`${esc(first(D.members[t.assigneeId].name))} no tiene mail cargado`}</span><span class="sp"></span>${D.members[t.assigneeId].email?`<button class="btn sm" data-act="notifySend" data-id="${esc(t.id)}">Enviar aviso por mail</button>`:`<button class="btn ghost sm" data-act="memEdit" data-mid="${esc(t.assigneeId)}">Cargar mail</button>`}</div>`:""}
<label class="fld"><span>Etapa</span><select class="inp" id="f-etapa" data-f="etapa" ${dis}>${opt("","—",!t.etapa)}${ETAPAS.map(e=>opt(e,e,t.etapa===e)).join("")}</select></label>
<label class="fld"><span>Notas</span><textarea class="inp" id="f-notes" data-f="notes" rows="4" placeholder="Detalles, medidas, links a planos, observaciones…" ${dis}>${esc(t.notes||"")}</textarea></label>
<div class="fld"><span>Checklist ${cl.length?`<span class="mono muted">${cl.filter(x=>x.d).length}/${cl.length}</span>`:""}</span>
<div class="checklist">${cl.map(x=>`<div class="ci ${x.d?"d":""}"><button class="chk ${x.d?"on":""}" data-act="ciToggle" data-ci="${esc(x.id)}" aria-label="Marcar ítem" ${dis}>${ic("check")}</button><span>${esc(x.t)}</span>${ro?"":`<button class="icon-btn" data-act="ciDel" data-ci="${esc(x.id)}" aria-label="Quitar ítem">${ic("x")}</button>`}</div>`).join("")}</div>
${ro?"":`<div class="row"><input class="inp" id="f-ci" placeholder="Agregar ítem (ej. Planta, Cortes, Fachadas)" style="flex:1"><button class="btn sm" data-act="ciAdd">Agregar</button></div>`}</div>
${acts.length?`<div class="fld"><span>Movimientos de esta tarea</span><div class="acts">${acts.map(e=>`<div><span class="tm">${fmtD(ymd(new Date(e.ts)))} ${hm(e.ts)}</span><span>${hSentence(e)[2]}</span></div>`).join("")}</div></div>`:""}
<div class="row"><span class="muted small">Creada ${t.createdAt?fmtD(ymd(new Date(t.createdAt))):""}${t.createdBy&&D.members[t.createdBy]?` por ${esc(D.members[t.createdBy].name)}`:""}</span><span class="sp"></span>${ro?"":`<span id="delZone"><button class="btn ghost sm danger" data-act="delAsk">${ic("trash")}Eliminar</button></span>`}</div>
</div>`);
  const ta=$("#f-title"); const fit=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"}; fit(); ta.addEventListener("input",fit);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ta.blur()}});
  const ci=$("#f-ci"); if(ci) ci.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ciAdd()}});
}
function refreshTask(){ const sc=$(".sheet")?.scrollTop; if(S.openTask){ taskModal(S.openTask); const s=$(".sheet"); if(s&&sc) s.scrollTop=sc; } }
function ciAdd(){ const el=$("#f-ci"); const v=(el&&el.value||"").trim(); if(!v) return; const t=DATA().tasks[S.openTask]; editTask(t.id,{checklist:[...(t.checklist||[]),{id:rid(),t:v,d:false}]}); refreshTask(); $("#f-ci")?.focus(); render(); }

function newTaskModal(pre={}){
  if(!canEdit()) return toast("Tenés acceso de solo lectura.");
  const pid=pre.projectId??(S.view==="project"?S.pid:(S.lastPid&&DATA().projects[S.lastPid]?S.lastPid:""));
  modal(`<div class="sheet-h"><h2>Nueva tarea</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<form class="sheet-b" id="ntForm">
<label class="fld"><span>¿Qué hay que hacer?</span><textarea class="inp" id="nt-title" rows="2" required autofocus placeholder="Ej. Enviar planos de instalación sanitaria al cliente"></textarea></label>
<div class="g2"><label class="fld"><span>Tablero</span><select class="inp" id="nt-proj">${projOpts(pid)}</select></label>
<label class="fld"><span>Responsable</span><select class="inp" id="nt-asg">${memOpts(pre.assigneeId??S.meId,pid)}</select></label>
<label class="fld"><span>Vence</span><input class="inp" type="date" id="nt-due" value="${esc(pre.due||"")}"></label>
<label class="fld"><span>Estado</span><select class="inp" id="nt-st">${STATUS.filter(s=>s.k!=="done").map(s=>opt(s.k,s.n,s.k==="todo")).join("")}</select></label>
<label class="fld"><span>Prioridad</span><select class="inp" id="nt-prio">${PRIO.map((l,i)=>opt(i,l,!i)).join("")}</select></label>
<label class="fld"><span>Etapa</span><select class="inp" id="nt-etapa">${opt("","—",1)}${ETAPAS.map(e=>opt(e,e)).join("")}</select></label></div>
<div class="row"><span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" type="submit">${ic("plus")}Crear tarea</button></div>
</form>`,"");
  $("#nt-proj").addEventListener("change",e=>{ const a=$("#nt-asg"); const v=a.value; a.innerHTML=memOpts(v,e.target.value); });
  const ta=$("#nt-title"); ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#ntForm").requestSubmit()}});
  $("#ntForm").addEventListener("submit",e=>{ e.preventDefault(); const title=$("#nt-title").value.trim(); if(!title){$("#nt-title").focus();return}
    const projectId=$("#nt-proj").value; S.lastPid=projectId||S.lastPid;
    createTask({title,projectId,assigneeId:$("#nt-asg").value,due:$("#nt-due").value,status:$("#nt-st").value,prio:$("#nt-prio").value,etapa:$("#nt-etapa").value});
    closeModal(); toast("Tarea creada"); });
}

function nextCode(kind){ const pre=kind==="proyecto"?"P":"O"; const n=Object.values(DATA().projects).filter(p=>(p.kind||"obra")===kind).length+1; return pre+"-"+pad(n); }
function projModal(id,kind){
  if(!canEdit()) return;
  const p=id?DATA().projects[id]:{name:"",kind:kind||"obra",client:"",place:"",color:Object.keys(DATA().projects).length%NC,code:nextCode(kind||"obra")};
  const st={kind:p.kind||"obra",color:p.color||0};
  const draw=()=>{ modal(`<div class="sheet-h"><h2>${id?"Editar tablero":"Nuevo tablero"}</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<form class="sheet-b" id="pjForm">
${!id&&!projectsL().length?`<p class="muted small" style="margin:0">Un tablero por cada obra o proyecto. Cada uno tiene sus columnas: Pendiente, En curso, En revisión y Terminado.</p>`:""}
<div class="fld"><span>Tipo</span><div class="seg" role="group">${[["obra","Obra"],["proyecto","Proyecto"]].map(([k,l])=>`<button type="button" data-pk="${k}" aria-pressed="${st.kind===k}">${l}</button>`).join("")}</div></div>
<div class="g3" style="grid-template-columns:110px minmax(0,1fr)"><label class="fld"><span>Código</span><input class="inp mono" id="pj-code" value="${esc(p.code||"")}" maxlength="10"></label>
<label class="fld"><span>Nombre</span><input class="inp" id="pj-name" value="${esc(p.name)}" required autofocus placeholder="Ej. Residencia Villa Morra"></label></div>
<div class="g2"><label class="fld"><span>Cliente</span><input class="inp" id="pj-client" value="${esc(p.client||"")}" placeholder="Opcional"></label>
<label class="fld"><span>Ubicación</span><input class="inp" id="pj-place" value="${esc(p.place||"")}" placeholder="Opcional"></label></div>
<div class="fld"><span>Color</span><div class="swatches">${Array.from({length:NC},(_,i)=>`<button type="button" data-pcol="${i}" style="--pc:var(--c${i})" aria-label="Color ${i+1}" aria-pressed="${st.color===i}"></button>`).join("")}</div></div>
<div class="row">${id?`<button type="button" class="btn ghost sm" data-act="archProj" data-pid="${esc(id)}">${ic("archive")}${p.archived?"Reactivar":"Archivar"}</button>`:""}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" type="submit">${id?"Guardar":"Crear tablero"}</button></div>
</form>`,"narrow");
    $$("[data-pk]").forEach(b=>b.onclick=()=>{ st.kind=b.dataset.pk; if(!id){ const c=$("#pj-code"); if(/^[OP]-\d+$/.test(c.value)) c.value=nextCode(st.kind);} $$("[data-pk]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    $$("[data-pcol]").forEach(b=>b.onclick=()=>{ st.color=+b.dataset.pcol; $$("[data-pcol]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    $("#pjForm").addEventListener("submit",e=>{ e.preventDefault(); const name=$("#pj-name").value.trim(); if(!name) return $("#pj-name").focus();
      const o={name,kind:st.kind,color:st.color,code:$("#pj-code").value.trim(),client:$("#pj-client").value.trim(),place:$("#pj-place").value.trim()};
      if(id){ patch("projects",id,o); log("pedit",{projectId:id,pname:name}); closeModal(); toast("Tablero guardado"); }
      else { const nid=rid(); put("projects",nid,{...o,archived:false,order:(Math.max(0,...Object.values(DATA().projects).map(x=>x.order||0))+1024),createdAt:Date.now(),createdBy:S.meId||""});
        log("pcreate",{projectId:nid,pname:name}); S.lastPid=nid; $("#layer").innerHTML=""; go("project",nid); toast("Tablero creado. Agregá la primera tarea."); }
    }); };
  draw();
}

function teamModal(editId){
  const D=DATA(); const ms=membersL(); const e=editId?D.members[editId]:null; let col=e?e.color||0:ms.length%NC;
  const adm=S.isAdmin, self=e&&e.id===S.meId, canForm=adm||self;
  modal(`<div class="sheet-h"><h2>Equipo del estudio</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<div class="sheet-b">
<div class="mlist">${ms.map(m=>`<div class="mrow">${avHTML(m,"lg")}<div class="nm"><b>${esc(m.name)}${m.id===S.meId?' <span class="muted" style="font-weight:400">(vos)</span>':""}${m.isAdmin?' <span class="pill">Admin</span>':""}</b><span>${esc(m.role||"Sin rol")} · ${tasksL(t=>t.assigneeId===m.id&&t.status!=="done").length} abiertas</span><span class="mono" style="font-size:11.5px">${esc(m.email||"")}${m.uid?"":" · todavía no entró"}</span></div>
${adm||m.id===S.meId?`<button class="icon-btn" data-act="memEdit" data-mid="${esc(m.id)}" aria-label="Editar">${ic("edit")}</button>`:""}${adm&&m.id!==S.meId?`<button class="icon-btn" data-act="memDel" data-mid="${esc(m.id)}" aria-label="Quitar">${ic("trash")}</button>`:""}</div>`).join("")}</div>
<div id="memConfirm"></div>
${(e?canForm:adm)?`<form id="memForm" style="display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px">
<h3>${e?"Editar a "+esc(e.name):"Agregar persona"}</h3>
<div class="g2"><label class="fld"><span>Nombre y apellido</span><input class="inp" id="mm-name" value="${esc(e?e.name:"")}" required ${e?"":"autofocus"} placeholder="Ej. Sofía Benítez"></label>
<label class="fld"><span>Rol</span><input class="inp" id="mm-role" value="${esc(e?e.role||"":"")}" placeholder="Ej. Dibujante BIM, Dirección de obra"></label></div>
<label class="fld"><span>Mail (con este mail entra al sistema)</span><input class="inp" type="email" id="mm-email" value="${esc(e?e.email||"":"")}" placeholder="nombre@ejemplo.com" autocomplete="off" ${adm?"":"disabled"} required></label>
${adm?`<label class="row" style="font-size:13px"><input type="checkbox" id="mm-admin" ${e&&e.isAdmin?"checked":""} ${self?"disabled":""}> Administrador (puede sumar y quitar personas)</label>`:""}
<div class="fld"><span>Color</span><div class="swatches">${Array.from({length:NC},(_,i)=>`<button type="button" data-mcol="${i}" style="--pc:var(--c${i})" aria-label="Color ${i+1}" aria-pressed="${col===i}"></button>`).join("")}</div></div>
<div class="row"><span class="sp"></span>${e?`<button type="button" class="btn ghost" data-act="manageTeam">Cancelar</button>`:""}<button class="btn pri" type="submit">${e?"Guardar":`${ic("plus")}Agregar`}</button></div>
<p class="muted small" style="margin:0">Para entrar, cada persona abre el enlace del sistema, escribe su mail y recibe un código.</p>
</form>`:`<p class="muted small" style="margin:0">Solo un administrador puede sumar o quitar personas.</p>`}</div>`,"narrow");
  $$("[data-mcol]").forEach(b=>b.onclick=()=>{ col=+b.dataset.mcol; $$("[data-mcol]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const f=$("#memForm"); if(!f) return;
  f.addEventListener("submit",ev=>{ ev.preventDefault(); const name=$("#mm-name").value.trim(); if(!name) return; const role=$("#mm-role").value.trim();
    const email=$("#mm-email").value.trim().toLowerCase(); if(!okMail(email)){ toast("Revisá el mail: parece incompleto."); $("#mm-email").focus(); return; }
    if(!e&&Object.values(DATA().members).some(m=>(m.email||"").toLowerCase()===email)){ toast("Ese mail ya está en el equipo."); return; }
    const isAdmin=adm&&$("#mm-admin")?$("#mm-admin").checked:!!(e&&e.isAdmin);
    if(e){ const p={name,role,color:col}; if(adm){ p.email=email; if(!self) p.isAdmin=isAdmin; } patch("members",e.id,p); log("member",{what:`actualizó los datos de ${name}`}); }
    else { const id=rid(); put("members",id,{name,role,color:col,email,isAdmin,order:Date.now()/1000}); log("member",{what:`sumó a ${name} al equipo`}); }
    render(); teamModal(); });
}

function designateModal(pid){
  if(!canEdit()) return toast("Tenés acceso de solo lectura.");
  const p=DATA().projects[pid]; if(!p) return; const ms=membersL();
  if(!ms.length){ toast("Primero cargá al equipo del estudio."); teamModal(); return; }
  const st={team:new Set(pTeam(p)),lead:DATA().members[p.lead]?p.lead:""}; if(st.lead) st.team.add(st.lead);
  const draw=()=>{ modal(`<div class="sheet-h"><h2>Designar personas</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<div class="sheet-b"><div class="row"><span class="stamp"><small>${p.kind==="proyecto"?"Proy.":"Obra"}</small>${esc(p.code||"—")}</span><b>${esc(p.name)}</b></div>
<p class="muted small" style="margin:0">Marcá quiénes trabajan en ${p.kind==="proyecto"?"este proyecto":"esta obra"} y elegí un responsable. Aparecen primero al asignar tareas de este tablero.</p>
<div class="mlist">${ms.map(m=>{const on=st.team.has(m.id);return `<div class="pick ${on?"on":""}" style="cursor:default"><button type="button" class="avbtn" data-dsg="${esc(m.id)}" aria-pressed="${on}" aria-label="${on?"Quitar a":"Designar a"} ${esc(m.name)}" style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;border-radius:6px"><span class="tick">${ic("check")}</span>${avHTML(m,"lg")}<span style="display:grid;min-width:0"><b>${esc(m.name)}</b><span class="muted small">${esc(m.role||"")}</span></span></button>
<button type="button" class="leadbtn" data-lead="${esc(m.id)}" aria-pressed="${st.lead===m.id}" ${on?"":"disabled"}>${st.lead===m.id?"Responsable":"Hacer responsable"}</button></div>`}).join("")}</div>
<div class="row"><span class="muted small">${st.team.size} ${st.team.size===1?"persona designada":"personas designadas"}</span><span class="sp"></span><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" id="dsgSave">Guardar</button></div></div>`,"narrow");
    $$("[data-dsg]").forEach(b=>b.onclick=()=>{ const id=b.dataset.dsg; if(st.team.has(id)){ st.team.delete(id); if(st.lead===id) st.lead=""; } else st.team.add(id); draw(); });
    $$("[data-lead]").forEach(b=>b.onclick=()=>{ st.lead=st.lead===b.dataset.lead?"":b.dataset.lead; draw(); });
    $("#dsgSave").onclick=()=>{ const team=[...st.team]; patch("projects",pid,{team,lead:st.lead}); log("pteam",{projectId:pid,pname:p.name,lead:st.lead,leadName:mName(st.lead),count:team.length}); closeModal(); toast("Equipo designado"); }; };
  draw();
}
function assignModal(id){
  if(!canEdit()) return toast("Tenés acceso de solo lectura.");
  const t=DATA().tasks[id]; if(!t) return; const p=DATA().projects[t.projectId]; const tm=p?[...new Set([p.lead,...pTeam(p)].filter(Boolean))]:[];

<button class="pick ${!t.assigneeId?"on":""}" data-act="assignTo" data-id="${esc(id)}" data-mid="">${avHTML(null,"lg")}<span style="flex:1"><b>Sin responsable</b></span></button></div>
${membersL().length?"":`<button class="btn" data-act="manageTeam">${ic("plus")}Cargar al equipo</button>`}</div>`,"narrow");

/* ---------- clicks ---------- */
document.addEventListener("click",e=>{
  if(Date.now()-S.justDragged<350){ e.preventDefault(); e.stopPropagation(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act, ds=a.dataset;
  switch(act){
    case "nav": go(ds.view); break;
    case "openProj": S.lastPid=ds.pid; go("project",ds.pid); break;
    case "openTask": taskModal(ds.id); break;
    case "toggle": { e.stopPropagation(); const t=DATA().tasks[ds.id]; if(!t) break; moveTask(ds.id,{status:t.status==="done"?"todo":"done"}); render(); if(S.openTask) refreshTask(); break; }
    case "quick": openQuick(a.closest(".col")); break;
    case "quickAdd": quickAdd(a.closest(".col")); break;
    case "quickCancel": S.quickOpen=null; render(); break;
    case "newTask": newTaskModal(ds.due?{due:ds.due}:{}); break;
    case "newProj": projModal(null,ds.kind||"obra"); break;
    case "editProj": projModal(ds.pid); break;
    case "archProj": { const p=DATA().projects[ds.pid]; patch("projects",ds.pid,{archived:!p.archived}); log("parch",{projectId:ds.pid,pname:p.name,to:!p.archived}); $("#layer").innerHTML=""; go("boards"); toast(p.archived?"Tablero reactivado":"Tablero archivado"); break; }
    case "toggleArch": S.showArch=!S.showArch; render(); break;
    case "fm": S.fm=S.fm===ds.mid?null:ds.mid; render(); break;
    case "teamDone": S.teamDone=!S.teamDone; render(); break;
    case "manageTeam": teamModal(); break;
    case "designate": designateModal(ds.pid); break;
    case "notifyNo": hideNotify(); break;
    case "notifySend": sendNotify(ds.id); break;
    case "memEditClose": hideNotify(); teamModal(ds.mid); break;
    case "copyMail": { const txt=S.mailCopy||""; const sel=()=>{ const el=$("#mailPrev"); const r=document.createRange(); r.selectNodeContents(el); const g=getSelection(); g.removeAllRanges(); g.addRange(r); toast("Texto seleccionado. Copialo con Ctrl+C o mantené apretado."); };
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Mensaje copiado"),sel); }catch(_){ sel(); } break; }
    case "assignPick": e.stopPropagation(); assignModal(ds.id); break;
    case "assignTo": moveTask(ds.id,{assigneeId:ds.mid}); closeModal(); break;
    case "memEdit": teamModal(ds.mid); break;
    case "memDel": { const m=DATA().members[ds.mid]; const n=tasksL(t=>t.assigneeId===ds.mid&&t.status!=="done").length;
      $("#memConfirm").innerHTML=`<div class="confirm"><span>¿Quitar a ${esc(m.name)}? ${n?`Sus ${n} tareas abiertas quedan sin responsable.`:""}</span><span class="sp"></span><button class="btn sm" data-act="manageTeam">No</button><button class="btn sm danger" data-act="memDelYes" data-mid="${esc(ds.mid)}">Quitar</button></div>`; break; }
    case "memDelYes": { const m=DATA().members[ds.mid]; tasksL(t=>t.assigneeId===ds.mid).forEach(t=>patch("tasks",t.id,{assigneeId:""})); Object.values(DATA().projects).filter(p=>(p.team||[]).includes(ds.mid)||p.lead===ds.mid).forEach(p=>patch("projects",p.id,{team:(p.team||[]).filter(x=>x!==ds.mid),lead:p.lead===ds.mid?"":p.lead})); del("members",ds.mid); log("member",{what:`quitó a ${m.name} del equipo`}); if(S.meId===ds.mid) S.meId=null; render(); teamModal(); break; }
    case "whoami": profileModal(); break;
    case "signOut": sb.auth.signOut().then(()=>location.replace(APP_URL)); break;
    case "calNav": { let {y,m}=S.cal; m+=+ds.d; if(m<0){m=11;y--} if(m>11){m=0;y++} S.cal.y=y;S.cal.m=m; render(); break; }
    case "calToday": { const n=new Date(); S.cal.y=n.getFullYear(); S.cal.m=n.getMonth(); S.cal.sel=TODAY(); render(); break; }
    case "calSel": S.cal.sel=ds.day; { const d=pYmd(ds.day); if(d.getMonth()!==S.cal.m){S.cal.m=d.getMonth();S.cal.y=d.getFullYear()} } render(); if(innerWidth<=820) $(".daypanel")?.scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "calMine": S.cal.mine=!S.cal.mine; render(); break;
    case "calProj": S.cal.pid=S.cal.pid===ds.pid?"":ds.pid; render(); break;
    case "histMore": loadOlder(); break;
    case "setStatus": moveTask(S.openTask,{status:ds.s}); render(); refreshTask(); break;
    case "ciToggle": { const t=DATA().tasks[S.openTask]; const it=(t.checklist||[]).find(x=>x.id===ds.ci); const cl=t.checklist.map(x=>x.id===ds.ci?{...x,d:!x.d}:x); editTask(t.id,{checklist:cl}); if(it&&!it.d) log("check",{taskId:t.id,title:t.title,projectId:t.projectId,item:it.t}); refreshTask(); render(); break; }
    case "ciDel": { const t=DATA().tasks[S.openTask]; editTask(t.id,{checklist:t.checklist.filter(x=>x.id!==ds.ci)}); refreshTask(); render(); break; }
    case "ciAdd": ciAdd(); break;
    case "delAsk": $("#delZone").innerHTML=`<span class="confirm">¿Eliminar esta tarea? <button class="btn sm" data-act="delNo">No</button><button class="btn sm danger" data-act="delYes">Eliminar</button></span>`; break;
    case "delNo": refreshTask(); break;
    case "delYes": { const id=S.openTask; $("#layer").innerHTML=""; S.openTask=null; deleteTask(id); render(); break; }
    case "close": closeModal(); break;
    case "scrim": if(e.target===a) closeModal(); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#layer").innerHTML){ closeModal(); return; }
  if(e.key==="Enter"&&e.target.matches(".card,.pcard,.pitem,.cal .d")){ e.target.click(); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.hf){ S.hf[el.dataset.hf]=el.value; render(); return; }
  const f=el.dataset.f; if(!f||!S.openTask) return; const id=S.openTask, t=DATA().tasks[id]; if(!t) return; const v=el.value;
  if(f==="title"){ const nv=v.trim(); if(nv&&nv!==t.title) editTask(id,{title:nv},"el título"); else el.value=t.title; }
  else if(f==="notes"){ if(v!==(t.notes||"")) editTask(id,{notes:v},"las notas"); }
  else if(f==="prio"){ editTask(id,{prio:+v},"la prioridad"); }
  else if(f==="etapa"){ editTask(id,{etapa:v},"la etapa"); }
  else if(f==="projectId"||f==="assigneeId"||f==="due"){ moveTask(id,{[f]:v}); if(f==="projectId"||f==="assigneeId") refreshTask(); }
  render();
});

/* ---------- arrastrar y soltar (mouse y táctil) ---------- */
let P=null, DRAG=null, raf=0;
function pressStart(x,y,el,touch){ if(!S.canWrite) return; P={x,y,el,touch,cx:x,cy:y,t:touch?setTimeout(()=>{ if(P) begin(P.cx,P.cy); },380):0}; }
document.addEventListener("mousedown",e=>{ if(e.button!==0) return; const el=e.target.closest("[data-drag]"); if(!el||e.target.closest("button,input,select,textarea,a,[data-nodrag]")) return; pressStart(e.clientX,e.clientY,el,false); });
document.addEventListener("mousemove",e=>{ if(DRAG){ e.preventDefault(); moveTo(e.clientX,e.clientY); } else if(P&&!P.touch&&Math.hypot(e.clientX-P.x,e.clientY-P.y)>6){ e.preventDefault(); begin(e.clientX,e.clientY); } });
document.addEventListener("mouseup",()=>{ if(DRAG) end(true); P=null; });
document.addEventListener("touchstart",e=>{ if(e.touches.length>1){ if(P){clearTimeout(P.t);P=null} return; } const el=e.target.closest("[data-drag]"); if(!el||e.target.closest("button,input,select,textarea,a,[data-nodrag]")) return; const t=e.touches[0]; pressStart(t.clientX,t.clientY,el,true); },{passive:true});
document.addEventListener("touchmove",e=>{ const t=e.touches[0]; if(DRAG){ e.preventDefault(); moveTo(t.clientX,t.clientY); } else if(P){ P.cx=t.clientX;P.cy=t.clientY; if(Math.hypot(t.clientX-P.x,t.clientY-P.y)>10){ clearTimeout(P.t); P=null; } } },{passive:false});
document.addEventListener("touchend",e=>{ if(DRAG){ e.preventDefault(); end(true); } else if(P){ clearTimeout(P.t); P=null; } },{passive:false});
document.addEventListener("touchcancel",()=>{ if(DRAG) end(false); if(P){clearTimeout(P.t);P=null} });
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-drag]")&&(P||DRAG)) e.preventDefault(); });
window.addEventListener("blur",()=>{ if(DRAG) end(false); });

function begin(x,y){
  const el=P.el; clearTimeout(P.t); P=null;
  const kind=el.dataset.drag, id=kind==="task"?el.dataset.id:el.dataset.pid; const r=el.getBoundingClientRect();
  const g=el.cloneNode(true); g.classList.add("drag-ghost"); g.classList.remove("dragging"); g.removeAttribute("data-drag"); g.removeAttribute("data-drop");
  g.style.width=r.width+"px"; g.style.height=r.height+"px"; document.body.appendChild(g);
  DRAG={kind,id,el,g,dx:x-r.left,dy:y-r.top,h:r.height,tgt:null,ph:null,x,y,idx:0,cards:[]};
  el.classList.add("dragging"); document.body.classList.add("is-dragging");
  if(kind==="task") showDock();
  try{ navigator.vibrate&&navigator.vibrate(15) }catch(_){}
  moveTo(x,y); cancelAnimationFrame(raf); raf=requestAnimationFrame(autoScroll);
}
function findTarget(x,y){
  const hit=document.elementFromPoint(x,y); if(!hit) return null;
  if(DRAG.kind==="task"){ const t=hit.closest("[data-drop]"); return t&&!t.classList.contains("drag-ghost")?t:null; }
  const t=hit.closest("[data-proj]"); return t&&t.dataset.proj!==DRAG.id?t:null;
}
function moveTo(x,y){
  DRAG.x=x; DRAG.y=y; DRAG.g.style.transform=`translate(${x-DRAG.dx}px,${y-DRAG.dy}px) rotate(${DRAG.kind==="task"?2:1}deg)`;
  const t=findTarget(x,y);
  if(t!==DRAG.tgt){ DRAG.tgt&&DRAG.tgt.classList.remove("drop-on"); DRAG.tgt=t; t&&t.classList.add("drop-on"); }
  if(t&&t.dataset.drop==="col"&&DRAG.kind==="task"){
    const list=t.querySelector("[data-list]"); const cards=[...list.querySelectorAll(".card:not(.dragging)")];
    let idx=cards.length; for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(y<r.top+r.height/2){ idx=i; break; } }
    if(!DRAG.ph){ DRAG.ph=document.createElement("div"); DRAG.ph.className="ph"; DRAG.ph.style.height=Math.min(DRAG.h,120)+"px"; }
    const ref=cards[idx]||null; if(DRAG.ph.parentNode!==list||DRAG.ph.nextElementSibling!==ref) list.insertBefore(DRAG.ph,ref);
    list.querySelector(".col-empty")?.setAttribute("hidden","");
    DRAG.idx=idx; DRAG.cards=cards.map(c=>c.dataset.id);
  } else if(DRAG.ph&&DRAG.ph.parentNode){ const l=DRAG.ph.parentNode; DRAG.ph.remove(); l.querySelector(".col-empty")?.removeAttribute("hidden"); }
}
function autoScroll(){
  if(!DRAG) return; const {x,y}=DRAG; let moved=false; const E=56;
  const dock=$("#dock"); const dr=!dock.hidden?dock.getBoundingClientRect():null;
  const row=dr&&y>=dr.top&&y<=dr.bottom?document.elementFromPoint(x,y)?.closest(".dock-row"):null;
  if(row){ const r=row.getBoundingClientRect(); if(x<r.left+E){row.scrollLeft-=10;moved=true} else if(x>r.right-E){row.scrollLeft+=10;moved=true} }
  else {
    const b=document.elementFromPoint(x,y)?.closest(".board")||$(".board");
    if(b){ const r=b.getBoundingClientRect(); if(y>=r.top&&y<=r.bottom){ if(x<r.left+E){b.scrollLeft-=Math.ceil((E-(x-r.left))/3);moved=true} else if(x>r.right-E){b.scrollLeft+=Math.ceil((E-(r.right-x))/3);moved=true} } }
    const bottomEdge=dr?dr.top:innerHeight; const topEdge=($(".top")?.getBoundingClientRect().bottom)||0;
    if(y<topEdge+E&&y>topEdge-4){ window.scrollBy(0,-10); moved=true; } else if(y>bottomEdge-E&&y<bottomEdge){ window.scrollBy(0,10); moved=true; }
  }
  if(moved) moveTo(x,y);
  raf=requestAnimationFrame(autoScroll);
}
function end(commit){
  const d=DRAG; DRAG=null; cancelAnimationFrame(raf);
  d.g.remove(); d.el.classList.remove("dragging"); document.body.classList.remove("is-dragging"); d.tgt&&d.tgt.classList.remove("drop-on");
  const dock=$("#dock"); dock.hidden=true;
  if(commit&&d.tgt){ try{ d.kind==="task"?dropTask(d):dropProject(d); }catch(err){ console.warn(err); } }
  d.ph&&d.ph.remove(); S.justDragged=Date.now();
  render(); if(S.openTask) refreshTask();
}
function dropTask(d){
  const ds=d.tgt.dataset, ch={}, T=DATA().tasks;
  if(ds.drop==="col"){
    if(ds.status) ch.status=ds.status; if(ds.member!==undefined) ch.assigneeId=ds.member; if(ds.project!==undefined) ch.projectId=ds.project;
    const prev=T[d.cards[d.idx-1]], next=T[d.cards[d.idx]];
    ch.order=prev&&next?((prev.order||0)+(next.order||0))/2:prev?(prev.order||0)+1024:next?(next.order||0)-1024:Date.now();
  } else if(ds.drop==="set"){ if(ds.member!==undefined) ch.assigneeId=ds.member; if(ds.project!==undefined) ch.projectId=ds.project; }
  else if(ds.drop==="day"){ ch.due=ds.day; }
  moveTask(d.id,ch);
}
function dropProject(d){
  const tg=d.tgt, r=tg.getBoundingClientRect(); const grid=tg.classList.contains("pcard");
  const after=grid?(d.x>r.left+r.width/2):(d.y>r.top+r.height/2);
  const L=projectsL(true).map(p=>p.id).filter(id=>id!==d.id); let i=L.indexOf(tg.dataset.proj); if(i<0) return; L.splice(i+(after?1:0),0,d.id);
  const p=DATA().projects[d.id];
  L.forEach((id,k)=>{ const o=(k+1)*1024; if(DATA().projects[id].order!==o) patch("projects",id,{order:o}); });
  log("porder",{projectId:d.id,pname:p.name}); toast("Tableros reordenados");
}
function showDock(){
  const ms=membersL(), ps=projectsL(); if(!ms.length&&!ps.length) return;
  $("#dock").innerHTML=`${ms.length?`<div class="dock-row"><span class="lbl">Pasar a</span>${ms.map(m=>`<div class="dk" data-drop="set" data-member="${esc(m.id)}">${avHTML(m)}<span>${esc(first(m.name))}</span></div>`).join("")}</div>`:""}
${ps.length?`<div class="dock-row"><span class="lbl">Mover a</span>${ps.map(p=>`<div class="dk proj" data-drop="set" data-project="${esc(p.id)}" style="${pc(p)}"><i class="sw"></i><span>${esc(p.name)}</span></div>`).join("")}</div>`:""}`;
  $("#dock").hidden=false;
}

/* ---------- conexión con Supabase ---------- */
const loginBody=h=>{ $("#loginBody").innerHTML=h; };
function showLogin(msg){
  $("#login").hidden=false;
  loginBody(`<p>El sistema de tareas del estudio.</p>
<form id="lf1" autocomplete="on"><label class="fld"><span>Tu mail</span><input class="inp" type="email" id="lemail" required autocomplete="email" inputmode="email" placeholder="nombre@ejemplo.com" value="${esc(ls.get("gab.email")||"")}"></label>
<button class="btn pri" type="submit">Recibir código por mail</button>${msg?`<p class="msg err">${esc(msg)}</p>`:""}<p class="msg">Te mandamos un código de un solo uso. No hace falta contraseña.</p></form>`);
  $("#lf1").addEventListener("submit",async e=>{ e.preventDefault(); const email=$("#lemail").value.trim().toLowerCase(); if(!okMail(email)) return;
    const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Enviando…"; ls.set("gab.email",email);
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:APP_URL}});
    if(error){ b.disabled=false; b.textContent="Recibir código por mail"; return showLogin(/rate|seconds/i.test(error.message)?"Esperá un minuto antes de pedir otro código.":"No se pudo enviar el código: "+error.message); }
    showCode(email); });
}
function showCode(email,msg){
  loginBody(`<form id="lf2"><p class="msg">Te mandamos un código a <b>${esc(email)}</b>. Revisá también la carpeta de spam.</p>
<label class="fld"><span>Código</span><input class="inp code" id="lcode" required inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]{6,10}"></label>
<button class="btn pri" type="submit">Entrar</button>${msg?`<p class="msg err">${esc(msg)}</p>`:""}<button type="button" class="link" id="lback">Usar otro mail o pedir otro código</button></form>`);
  $("#lcode").focus();
  $("#lback").onclick=()=>showLogin();
  $("#lf2").addEventListener("submit",async e=>{ e.preventDefault(); const token=$("#lcode").value.replace(/\D/g,""); const b=e.target.querySelector("button[type=submit]"); b.disabled=true; b.textContent="Verificando…";
    const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});
    if(error) return showCode(email,"El código no es válido o venció. Pedí uno nuevo.");
    startSession(data.session); });
}
function showNotMember(){
  $("#login").hidden=false;
  loginBody(`<form><p class="msg"><b>${esc(S.myEmail)}</b> todavía no está habilitado en Gabinete.</p><p class="msg">Pedile al administrador del estudio que te sume desde <b>Equipo → Gestionar equipo</b> con este mismo mail, y volvé a entrar.</p><button type="button" class="btn" id="lout">Salir</button></form>`);
  $("#lout").onclick=()=>sb.auth.signOut().then(()=>showLogin());
}
async function loadAll(){
  const [m,p,t,h]=await Promise.all([sb.from("members").select("*"),sb.from("projects").select("*"),sb.from("tasks").select("*"),sb.from("history").select("*").order("ts",{ascending:false}).limit(300)]);
  const err=m.error||p.error||t.error||h.error; if(err){ console.warn(err); return false; }
  S.L.members=Object.fromEntries(m.data.map(r=>[r.id,fromDb("members",r)]));
  S.L.projects=Object.fromEntries(p.data.map(r=>[r.id,fromDb("projects",r)]));
  S.L.tasks=Object.fromEntries(t.data.map(r=>[r.id,fromDb("tasks",r)]));
  S.L.history=h.data.map(fromHist);
  return true;
}
let rT=0; function scheduleRender(){ cancelAnimationFrame(rT); rT=requestAnimationFrame(()=>render()); }
function applyChange(coll,p){
  if(p.eventType==="DELETE"){ if(p.old&&p.old.id) delete S.L[coll][p.old.id]; }
  else S.L[coll][p.new.id]=fromDb(coll,p.new);
  if(coll==="members"){ const me=S.L.members[S.meId]; S.isAdmin=!!(me&&me.isAdmin); if(!me) return showNotMember(); }
  scheduleRender();
}
function subscribe(){
  if(S.ch) sb.removeChannel(S.ch);
  S.ch=sb.channel("gabinete")
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},p=>applyChange("tasks",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"projects"},p=>applyChange("projects",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"members"},p=>applyChange("members",p))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"history"},p=>{ const e=fromHist(p.new); const i=S.L.history.findIndex(x=>x.cid&&x.cid===e.cid); if(i>=0) S.L.history[i]=e; else S.L.history.unshift(e); if(S.view==="hist") scheduleRender(); })
    .subscribe();
}
let syncing=false;
async function resync(){ if(syncing||!S.session) return; syncing=true; try{ if(await loadAll()) render(); } finally{ syncing=false; } }
async function startSession(session){
  S.session=session; S.myEmail=(session.user.email||"").toLowerCase();
  loginBody(`<p>Entrando…</p>`);
  await sb.rpc("link_member");
  if(!await loadAll()){ return showLogin("No se pudo conectar con la base de datos. Revisá la conexión y volvé a intentar."); }
  const me=Object.values(S.L.members).find(m=>(m.email||"").toLowerCase()===S.myEmail);
  if(!me) return showNotMember();
  S.meId=me.id; S.isAdmin=!!me.isAdmin; S.canWrite=true; S.mode="live";
  $("#login").hidden=true;
  renderTop(); go(S.view||"home"); subscribe();
  if(!projectsL().length) setTimeout(()=>projModal(null,"obra"),300);
}
async function loadOlder(){
  const all=[...S.L.history,...S.histOlder]; const last=all[all.length-1]; if(!last) return;
  const {data,error}=await sb.from("history").select("*").lt("ts",new Date(last.ts).toISOString()).order("ts",{ascending:false}).limit(300);
  if(error) return onErr(error);
  const more=data.map(fromHist); S.histOlder.push(...more); if(more.length<300) S.histEnd=true; render();
}
async function boot(){
  $("#loginLogo").src=LOGO;
  if(!window.supabase){ loginBody(`<p>No se pudo cargar el sistema. Revisá la conexión a internet y recargá la página.</p>`); return; }
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==="SIGNED_OUT"){ S.session=null; showLogin(); } else if(ses) S.session=ses; });
  if(session) startSession(session); else showLogin();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") resync(); });
  addEventListener("online",()=>{ resync(); render(); }); addEventListener("offline",()=>render());
}
renderTabbar(); boot();
})();
</script>
