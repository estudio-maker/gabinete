<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gabinete · Pérez Ramírez Arquitectura</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabinete">
<meta name="theme-color" content="#1E2326">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var gt=localStorage.getItem("gab.theme");if(gt==="light"||gt==="dark")document.documentElement.setAttribute("data-theme",gt)}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: mesa de dibujo — barra lateral carbón tipo carátula, área de trabajo sobre papel milimetrado, columnas como hojas. Misma familia visual que ObraSys. */
:root{
  --paper:#ECEEEC; --sheet:#FFFFFF; --colbg:#F5F6F4; --ink:#16191B; --ink2:#4A5257; --ink3:#7C858A;
  --line:#D6DBD9; --line2:#E6E9E7; --grid:rgba(31,94,91,.06);
  --band:#1E2326; --bandfg:#EEF0EE; --bandline:rgba(255,255,255,.12); --bandhover:rgba(255,255,255,.06); --bandsel:rgba(255,255,255,.12);
  --accent:#1F5E5B; --accent2:#2D7D78; --accentbg:#E1EDEB; --tape:#F2B705; --tapebg:#FFF3C7; --tapefg:#1E2326;
  --ok:#2E7D4F; --okbg:#E0F1E6; --warn:#9A5D00; --warnbg:#FCEDD3; --bad:#B3261E; --badbg:#FBE3E0;
  --st-todo:#7C858A; --st-doing:#2D7D78; --st-review:#D49A00; --st-done:#2E7D4F;
  --c0:#1F5E5B; --c1:#B8641A; --c2:#3E5C9A; --c3:#8A4F7D; --c4:#5C7A2C; --c5:#B3443A; --c6:#2B7A91; --c7:#6B6258;
  --avfg:#FFFFFF;
  --shadow:0 1px 1px rgba(22,25,27,.04),0 2px 6px rgba(22,25,27,.05);
  --lift:0 18px 40px rgba(22,25,27,.28);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --side:252px; --colw:292px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:23px;font-weight:800} h2{font-size:18px;font-weight:750} h3{font-size:14px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;font-weight:700;color:var(--ink3)}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.ic{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--band);color:var(--bandfg);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px}
.brand{display:grid;gap:12px;padding:2px 8px 16px;border-bottom:1px solid var(--bandline)}
.brand img{width:128px;height:auto;display:block}
.brand .sys{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.brand span{font-size:11px;opacity:.6}
.nav{display:grid;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;opacity:.78;width:100%}
.nav button:hover{opacity:1;background:var(--bandhover)}
.nav button[aria-current="page"]{opacity:1;background:var(--bandsel);box-shadow:inset 3px 0 0 var(--tape)}
.nav button:focus-visible{outline:2px solid var(--tape)}
.nav .ic{width:18px;height:18px}
.nav .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.65}
.side-sec{display:grid;gap:1px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px;font-family:var(--f-display);font-stretch:78%;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;opacity:.55;font-weight:700}
.side-h button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;opacity:1}
.side-h button:hover{background:var(--bandhover)}
.pitem{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;opacity:.82;user-select:none;-webkit-user-select:none}
.pitem:hover{background:var(--bandhover);opacity:1}
.pitem[aria-current="page"]{background:var(--bandsel);opacity:1}
.pitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .cd{font-family:var(--f-mono);font-size:10.5px;opacity:.55}
.pitem .k{font-family:var(--f-mono);font-size:11px;opacity:.6}
.pitem.drop-on{background:var(--tape);color:var(--tapefg);opacity:1}
.sw{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none;display:inline-block}
.side-empty{padding:4px 10px;font-size:12px;opacity:.55}
.me-box{margin-top:auto;border-top:1px solid var(--bandline);padding:12px 8px 0;display:flex;gap:10px;align-items:center;font-size:12.5px}
.me-box .who{flex:1;min-width:0;display:grid}
.me-box .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box .who span{opacity:.6;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box button{all:unset;cursor:pointer;font-size:11.5px;opacity:.7;text-decoration:underline;text-underline-offset:2px}

.main{min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .mk{display:none;width:30px;height:30px;border-radius:7px}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .me-mini{display:none}
.search{display:flex;align-items:center;gap:7px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:250px;color:var(--ink3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0;flex:1}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--tapebg);color:var(--ink);border:1px dashed var(--tape);font-size:13px}
.banner b{font-weight:600}
.banner.ro{background:var(--accentbg);border-color:var(--accent)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tapefg);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;min-height:28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.inp{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 9px;min-width:0;width:100%;min-height:36px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accentbg)}
textarea.inp{resize:vertical;line-height:1.45}
.fld{display:grid;gap:5px;font-size:12px;color:var(--ink2);min-width:0}
.fld>span{font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;background:var(--sheet)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;background:var(--pc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* avatars & chips */
.av{width:24px;height:24px;border-radius:50%;background:var(--ac,var(--c7));color:var(--avfg);display:inline-grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-display);font-stretch:85%;letter-spacing:.04em;flex:none;line-height:1}
.av.lg{width:34px;height:34px;font-size:12.5px}
.av.none{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2);max-width:100%;min-width:0}
.chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.tag{font-size:10.5px;font-family:var(--f-display);font-stretch:82%;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--ink3);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:2px 24px 18px;margin-inline:-24px;align-items:flex-start;scroll-snap-type:x proximity;scroll-padding-inline:24px;min-height:50vh;overscroll-behavior-x:contain}
.col{flex:0 0 var(--colw);background:var(--colbg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;scroll-snap-align:start;min-width:0;transition:border-color .12s,box-shadow .12s}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;min-width:0}
.col-h h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .who{display:grid;min-width:0;flex:1}
.col-h .n{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:auto}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--stc)}
.col-list{display:flex;flex-direction:column;gap:8px;padding:2px 8px 8px;min-height:52px}
.col-empty{border:1.5px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;font-size:12px;color:var(--ink3)}
.col.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.col-more{font-size:12px;color:var(--ink3);padding:0 12px 10px}
.quick{padding:0 8px 8px;display:grid;gap:6px}
.quick>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;color:var(--ink2);font-size:13px}
.quick>button:hover{background:var(--line2);color:var(--ink)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 11px 9px;display:grid;gap:7px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.card:hover{border-color:var(--ink3)}
.card.dragging{opacity:.28}
.card .meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;min-width:0}
.ttl{display:flex;gap:8px;align-items:flex-start;min-width:0}
.ttl .t{font-size:13.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.chk{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;box-sizing:border-box}
.chk .ic{width:12px;height:12px}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.chk.lg{width:24px;height:24px}
.chk.lg .ic{width:15px;height:15px}
.card.done .t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);min-height:22px}
.due{font-family:var(--f-mono);font-size:11px;display:inline-flex;gap:4px;align-items:center;padding:1px 6px;border-radius:4px;background:var(--line2);white-space:nowrap}
.due .ic{width:12px;height:12px}
.due.over{background:var(--badbg);color:var(--bad)} .due.today{background:var(--tapebg);color:var(--warn)}
.prio{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.prio .ic{width:12px;height:12px}
.prio.p1{color:var(--warn)} .prio.p2{color:var(--bad)}
.cl{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px}
.cl .ic{width:13px;height:13px}
.cl.full{color:var(--ok)}
.dim{color:var(--ink3)}

.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;margin:0;box-shadow:var(--lift);border-color:var(--accent);opacity:.97;cursor:grabbing}
.ph{border:2px dashed var(--accent);border-radius:8px;background:var(--accentbg);flex:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging .card:hover{border-color:var(--line)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:250;background:var(--band);color:var(--bandfg);border-radius:14px;padding:10px 12px;display:grid;gap:8px;width:min(760px,calc(100vw - 24px));box-shadow:var(--lift)}
.dock-row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.dock-row::-webkit-scrollbar{display:none}
.dock .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.6;font-family:var(--f-display);font-stretch:80%;font-weight:700;white-space:nowrap;min-width:64px}
.dk{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--bandsel);font-size:12.5px;white-space:nowrap;flex:none;transition:background .1s,transform .1s}
.dk.proj{padding-left:10px}
.dk.drop-on{background:var(--tape);color:var(--tapefg);transform:scale(1.06)}

/* tiles */
.hello{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hello .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}

.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h .sp{flex:1}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.pcard:hover{border-color:var(--ink3)}
.pcard.dragging{opacity:.3}
.pcard.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.pcard.arch{opacity:.6}
.pcard .hd{display:flex;gap:10px;align-items:flex-start}
.pcard .hd .nm{flex:1;min-width:0;display:grid;gap:2px}
.pcard h3{font-size:16px;overflow-wrap:anywhere}
.pcard .cli{font-size:12px;color:var(--ink3)}
.stamp{border:1.5px solid var(--ink);padding:2px 6px;font-family:var(--f-mono);font-size:11px;line-height:1.2;text-align:center;display:grid;flex:none;border-radius:2px}
.stamp small{font-family:var(--f-display);font-stretch:80%;font-size:9px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);margin:0 -6px 2px;padding:0 6px 1px}
.meter{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:3px}
.pcard .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.avs{display:flex}

.pnew{border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;gap:6px;padding:24px;color:var(--ink2);cursor:pointer;background:transparent;font-size:13.5px;min-height:150px}

.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pteam{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pteam .lb{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.11em;font-size:10.5px;font-weight:700;color:var(--ink3)}

.avbtn{all:unset;cursor:pointer;border-radius:50%;display:inline-grid}

.pick.on{border-color:var(--accent);background:var(--accentbg)}
.pick .tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink3);display:grid;place-items:center;color:transparent;flex:none}
.pick.on .tick{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.leadbtn{all:unset;cursor:pointer;font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.leadbtn[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tapefg);font-weight:600}
.leadbtn:disabled{opacity:.35;cursor:default}
.mgrp{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.11em;font-size:10.5px;font-weight:700;color:var(--ink3);padding:6px 2px 2px}
.fav{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:grid}
.fav[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.fav[aria-pressed="false"].dimmed{opacity:.4}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{min-width:170px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
.cal .dw{background:var(--colbg);padding:7px 8px;font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:700;color:var(--ink3);border-bottom:1px solid var(--line)}
.cal .d{background:var(--sheet);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transition:background .1s}
.cal .d:hover{background:var(--colbg)}
.cal .d.out{background:var(--colbg)}
.cal .d.out .dn{opacity:.45}
.cal .d.we{background:color-mix(in srgb,var(--colbg) 60%,var(--sheet))}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.drop-on{background:var(--accentbg)}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--ink2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.d.today .dn{background:var(--tape);color:var(--tapefg);font-weight:600}
.cc{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--colbg);min-width:0;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{flex-direction:column;align-items:stretch;gap:0;border-left:3px solid var(--pc)}
.cc .cb{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);font-size:12px;max-width:100%}
.legend button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend button .k{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.legend button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend.filtering button[aria-pressed="false"]{opacity:.45}
.bgroup{display:grid;gap:8px}
.bgroup>h3{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.bgroup>h3 .k{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:0}
.nodate{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:16px}
.cc.done span{text-decoration:line-through;color:var(--ink3)}
.cc.dragging{opacity:.3}
.dchips{display:grid;gap:3px;min-width:0}
.cmore{font-size:11px;color:var(--ink3);padding-left:4px}
.ddots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.ddots i{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.daypanel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.daylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}

/* history */
.hfil{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.hfil .fld{width:220px;max-width:100%}
.hgroup{display:grid;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hgroup>h3{padding:9px 14px;background:var(--colbg);border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow .tx{min-width:0;overflow-wrap:anywhere}
.hrow .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)}
.hrow a,.alink{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.hrow a:hover,.alink:hover{text-decoration:underline}
.hk{display:inline-block;font-family:var(--f-display);font-stretch:80%;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:0 5px;border-radius:3px;margin-right:4px;background:var(--line2);color:var(--ink2);vertical-align:1px}
.hk.done{background:var(--okbg);color:var(--ok)} .hk.move{background:var(--accentbg);color:var(--accent)} .hk.del{background:var(--badbg);color:var(--bad)} .hk.new{background:var(--tapebg);color:var(--warn)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,13,.5);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.sheet{background:var(--sheet);border-radius:12px;width:100%;max-width:660px;max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:var(--lift);display:flex;flex-direction:column}
.sheet.narrow{max-width:480px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:2}
.sheet-b{padding:16px 18px 22px;display:grid;gap:16px}
.ttl-inp{font-family:var(--f-display);font-stretch:88%;font-size:20px;font-weight:700;border-color:transparent;padding:4px 6px;margin-left:-6px;width:calc(100% + 6px);resize:none;overflow:hidden}
.ttl-inp:hover{border-color:var(--line)}
.checklist{display:grid;gap:2px}
.ci{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:5px}
.ci:hover{background:var(--colbg)}
.ci span{flex:1;min-width:0;overflow-wrap:anywhere}
.ci.d span{text-decoration:line-through;color:var(--ink3)}
.ci-in{all:unset;flex:1;min-width:0;padding:3px 6px;border-radius:5px;border:1px solid transparent;cursor:text;line-height:1.4}
.ci-in:hover{border-color:var(--line)}
.ci-in:focus{border-color:var(--accent);background:var(--sheet);box-shadow:0 0 0 2px var(--accentbg)}
.ci.d .ci-in{text-decoration:line-through;color:var(--ink3)}
.ci .ci-h{width:22px;height:28px;display:grid;place-items:center;color:var(--ink3);cursor:grab;touch-action:none;border-radius:5px;flex:none;-webkit-user-select:none;user-select:none}
.ci .ci-h:hover{background:var(--line2);color:var(--ink)}
.ci.ci-drag{background:var(--sheet);box-shadow:var(--lift);position:relative;z-index:2;opacity:.96}
.ci.ci-drag .ci-h{cursor:grabbing}
.ppl{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);min-height:42px}
.ppl:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentbg)}
.ppl .pchip{display:inline-flex;align-items:center;gap:6px;padding:2px 4px 2px 2px;border-radius:99px;background:var(--line2);font-size:12.5px;font-weight:600;max-width:100%}
.ppl .pchip .av{width:22px;height:22px;font-size:9px}
.ppl .pchip button{all:unset;cursor:pointer;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;color:var(--ink3)}
.ppl .pchip button:hover{background:var(--line);color:var(--ink)}
.ppl .pchip .ic{width:12px;height:12px}
.ppl input{all:unset;flex:1;min-width:150px;padding:4px 6px;font-size:13.5px}
.ppl input::placeholder{color:var(--ink3)}
.pmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--lift);padding:4px;display:grid;gap:2px;max-height:260px;overflow:auto}
.pmenu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:7px;font-size:13px}
.pmenu button small{color:var(--ink3);font-size:11.5px;margin-left:auto;white-space:nowrap}
.pmenu button[aria-selected="true"],.pmenu button:hover{background:var(--accentbg)}
.pmenu .empty-m{padding:8px;color:var(--ink3);font-size:12.5px}
.who-tag .avst{display:flex}
.who-tag .avst .av{margin-left:-7px;box-shadow:0 0 0 2px var(--line2)}
.who-tag .avst .av:first-child{margin-left:0}
.priv-b{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);padding:1px 6px 1px 4px;border-radius:5px;background:var(--line2)}
.priv-b .ic{width:12px;height:12px}
.card.is-priv{border-left:3px solid var(--ink3)}
.privsec{display:grid;gap:12px;padding:14px;border:1px dashed var(--line);border-radius:12px;background:var(--colbg)}
.privsec .sec-h h2{display:flex;align-items:center;gap:8px}
.privsec.hid .board{display:none}
.privtog{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;background:var(--sheet)}
.privtog[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.privtog .ic{width:18px;height:18px}
.pushbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accentbg);color:var(--ink);font-size:13px}
.pushbar .ic{color:var(--accent)}
.ci .icon-btn{width:26px;height:26px;opacity:.5}
.ci:hover .icon-btn{opacity:1}
.acts{display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.acts div{display:flex;gap:8px;align-items:baseline}
.acts .tm{font-family:var(--f-mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--badbg);color:var(--bad);padding:8px 10px;border-radius:7px;font-size:13px}
.mlist{display:grid;gap:4px}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;border:1px solid var(--line2)}
.mrow .nm{flex:1;min-width:0;display:grid}
.mrow .nm span{font-size:12px;color:var(--ink3)}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid var(--line);width:100%}
.pick:hover{border-color:var(--accent);background:var(--accentbg)}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

.empty{padding:36px 16px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center;background:var(--sheet);border:1px dashed var(--line);border-radius:12px}
.empty h2{color:var(--ink)}
.empty p{margin:0;max-width:46ch}
.loading{padding:60px 16px;text-align:center;color:var(--ink2)}

.notify{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:260;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:min(440px,calc(100vw - 32px))}
.notify .tx{flex:1;min-width:160px;font-size:13px}
.notify .tx b{font-weight:600}
.mailrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.mailrow .addr{font-family:var(--f-mono);font-size:12px;user-select:all;-webkit-user-select:all}
.mailprev{background:var(--colbg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;user-select:text;-webkit-user-select:text;max-height:220px;overflow:auto}
.login{position:fixed;inset:0;z-index:500;background:var(--band);color:var(--bandfg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.login .box{width:100%;max-width:400px;display:grid;gap:18px}
.login img.lg{width:170px;justify-self:center}
.login h1{color:var(--bandfg);text-align:center;font-size:26px;letter-spacing:.12em;text-transform:uppercase;font-stretch:75%}
.login p{margin:0;text-align:center;opacity:.75;font-size:14px}
.login form{display:grid;gap:10px;background:var(--sheet);color:var(--ink);border-radius:12px;padding:18px}
.login .inp{font-size:16px;min-height:44px}
.login .code{font-family:var(--f-mono);letter-spacing:.3em;text-align:center;font-size:22px}
.login .btn{min-height:44px;font-size:15px}
.login .msg{font-size:13px;color:var(--ink2);text-align:left;opacity:1}
.login .err{color:var(--bad)}
.login .link{all:unset;cursor:pointer;color:var(--accent);font-size:13px;text-align:center;text-decoration:underline}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--band);color:var(--bandfg);padding:10px 16px;border-radius:8px;z-index:400;font-size:13px;box-shadow:var(--lift);max-width:calc(100vw - 32px)}
.tabbar{display:none}
.fab{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* proveedores / contratistas */
.prov-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--ink2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.prov-chip:hover{border-color:var(--accent);color:var(--accent)}
.prov-chip .ic{width:13px;height:13px}
.prov-chip.wait{border-color:var(--tape);background:var(--tapebg);color:var(--ink)}
.plist{display:grid;gap:6px}
.prow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--sheet)}
.prow .pi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accentbg);color:var(--accent);flex:none}
.prow .nm{flex:1;min-width:0;display:grid}

.prow a{color:var(--accent);text-decoration:none}
.okbtn{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--tape);background:var(--tapebg);color:var(--ink);white-space:nowrap}
.okbtn[aria-pressed="true"]{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.okbtn:disabled{cursor:default}
.ppick{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.ppick .res{display:grid;gap:4px;max-height:220px;overflow:auto}

.cgrid{display:grid;gap:8px}
.ccard{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.ccard .hd{display:flex;gap:10px;align-items:center}
.ccard .ts{display:grid;gap:4px}
.ccard .ts a{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 6px;border-radius:6px}
.ccard .ts a:hover{background:var(--line2)}
.ccard .ts .sd{width:8px;height:8px;border-radius:50%;background:var(--stc);flex:none}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:300;background:var(--ink);color:var(--sheet);border-radius:99px;padding:6px 8px 6px 16px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:var(--lift)}

@media (max-width:820px){
  :root{--colw:min(84vw,320px)}
  .app{grid-template-columns:1fr}

  .top{background:var(--band);color:var(--bandfg);border:0;padding:8px 16px 10px;gap:10px}

  .search{width:100%;order:5;height:38px}
  .view{padding:14px 16px 120px;gap:14px}
  .board{padding-inline:16px;margin-inline:-16px;scroll-padding-inline:16px;gap:10px;scroll-snap-type:x mandatory}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

  if(ch.assignees!==undefined){ const cur=asg(t), nx=[...new Set(ch.assignees.filter(x=>x&&D.members[x]))];

      if(add.length===1&&rm.length===1) log("assign",{...base,from:rm[0],fromName:mName(rm[0]),to:add[0],toName:mName(add[0])});
      else { add.forEach(x=>log("asgadd",{...base,to:x,toName:mName(x)})); rm.forEach(x=>log("asgrm",{...base,to:x,toName:mName(x)})); }
      if(add.length||rm.length) msgs.push(nx.length?(nx.length===1?"Asignada a ":"Responsables: ")+nx.map(x=>first(mName(x))).join(", "):"Sin responsable");
      const fresh=add.filter(x=>x!==S.meId); if(fresh.length) setTimeout(()=>notifyAssigned(id,fresh),400); } }
  if(ch.projectId!==undefined&&ch.projectId!==t.projectId){ p.projectId=ch.projectId; const np=D.projects[ch.projectId];
    log("project",{...base,from:t.projectId,fromName:base.pname,to:ch.projectId,toName:np?np.name:""}); msgs.push("Movida a "+(np?np.name:"sin tablero")); }
  if(ch.due!==undefined&&ch.due!==t.due){ p.due=ch.due; log("due",{...base,from:t.due,to:ch.due}); msgs.push(ch.due?"Vence el "+fmtD(ch.due):"Sin fecha"); }
  if(ch.private===false&&t.private){ p.private=false; log("priv",{...base,to:false}); msgs.push("Ahora la ve todo el equipo"); }
  if(ch.order!==undefined&&ch.order!==t.order) p.order=ch.order;
  if(!Object.keys(p).length) return;
  p.updatedAt=Date.now(); patch("tasks",id,p);
  if(p.private!==undefined||(t.private&&p.assigneeId!==undefined)) (chains["tasks/"+id]||Promise.resolve()).then(()=>setTimeout(bcastResync,300));
  if(!quiet&&msgs.length) toast(msgs.join(" · "));
}

async function sendNotify(id,toIds){
  hideNotify();
  const t=DATA().tasks[id]; if(!t) return;
  const ms=(toIds&&toIds.length?toIds:asg(t)).map(x=>DATA().members[x]).filter(Boolean);
  if(!ms.length) return toast("La tarea no tiene responsable.");
  const withMail=ms.filter(m=>okMail(m.email)); if(!withMail.length) return offerNotify(id,ms.map(m=>m.id));
  if(!NOTIFY_URL) return mailFallback(t,withMail[0],mailContent(t,withMail[0]),"Los avisos automáticos todavía no están configurados. Podés copiar el mensaje y mandarlo vos.");
  toast("Enviando aviso"+(withMail.length>1?"s":"")+"…");
  let token=null; try{ const {data:{session}}=await sb.auth.getSession(); token=session&&session.access_token; }catch(_){}
  const sent=[]; let fail=null;
  for(const m of withMail){
    try{ const r=await fetch(NOTIFY_URL,{method:"POST",body:JSON.stringify({token,taskId:id,to:m.id,app:APP_URL})}); const j=await r.json().catch(()=>({}));
      if(j&&j.ok){ sent.push(m); log("notify",{taskId:id,title:t.title,projectId:t.projectId,to:m.id,toName:m.name}); } else fail={m,err:(j&&j.error)||""};
    }catch(e){ fail={m,err:"sin conexión"}; }
  }
  if(sent.length) toast("Mail enviado a "+sent.map(m=>first(m.name)).join(", "));
  if(fail) mailFallback(t,fail.m,mailContent(t,fail.m),"No se pudo enviar el aviso automático a "+first(fail.m.name)+(fail.err?": "+fail.err:"")+". Podés copiar el mensaje y mandarlo vos.");
}

      const exact=contactsL().some(c=>c.name.trim().toLowerCase()===v);

        +(v&&!exact?`<button type="button" class="new" data-pnew>${ic("plus")}Agregar «${esc(q.value.trim())}» como nuevo</button>`:"")
        +(!L.length&&!v?`<span class="muted small">${contactsL().length?"Ya están todos agregados. Escribí un nombre para crear otro.":"La agenda está vacía. Escribí un nombre para crear el primero."}</span>`:"")

    list(); };

  const d=dayDiff(t.due,TODAY()); const dt=d<0?100+Math.min(-d,30):d===0?90:d===1?70:d<=3?50:d<=7?30:Math.max(10,20-Math.floor((d-7)/7));
  return pr+dt; }

function ciSortable(id){
  const list=$("#ciList"); if(!list) return;
  list.querySelectorAll("[data-cih]").forEach(h=>h.addEventListener("pointerdown",e=>{
    if(e.button>0) return; e.preventDefault(); const row=h.closest(".ci"); const sheet=list.closest(".sheet");
    row.classList.add("ci-drag"); try{ navigator.vibrate&&navigator.vibrate(10) }catch(_){}
    let lastY=e.clientY, sc=0;
    const move=ev=>{ lastY=ev.clientY; const rows=[...list.children].filter(r=>r!==row);
      let ref=null; for(const r of rows){ const b=r.getBoundingClientRect(); if(lastY<b.top+b.height/2){ ref=r; break; } }
      if(row.nextElementSibling!==ref) list.insertBefore(row,ref);
      const sb2=sheet&&sheet.getBoundingClientRect(); if(sb2){ sc=lastY<sb2.top+50?-8:lastY>sb2.bottom-50?8:0; } };

function mountPeople(host,{get,set,pid,ro}){
  let menu=null, sel=0, q="";
  const D=()=>DATA();
  const draw=(focus)=>{
    if(!host.isConnected) return; const list=get();
    host.innerHTML=`<div class="ppl">${list.map(id=>{const m=D().members[id]; return m?`<span class="pchip">${avHTML(m)}${esc(m.name)}${m.id===S.meId?' <span class="muted" style="font-weight:400">(vos)</span>':""}${ro?"":`<button type="button" data-prm="${esc(id)}" aria-label="Quitar a ${esc(m.name)}">${ic("x")}</button>`}</span>`:""}).join("")}
${ro?(list.length?"":`<span class="muted small">Sin responsable</span>`):`<input type="text" autocomplete="off" aria-label="Sumar responsable: escribí @ y el nombre" placeholder="${list.length?"@ para sumar a otra persona":"Escribí @ para elegir a alguien del equipo"}"><button type="button" class="icon-btn" data-padd aria-label="Sumar responsable" title="Sumar responsable" style="width:28px;height:28px">${ic("plus")}</button>`}</div>`;
    if(ro) return;
    const inp=host.querySelector("input");
    host.querySelectorAll("[data-prm]").forEach(b=>b.onclick=()=>{ set(get().filter(x=>x!==b.dataset.prm)); draw(true); });
    const openMenu=()=>{ const cur=get(); const p=D().projects[pid&&pid()]; const tm=p?[...new Set([p.lead,...pTeam(p)].filter(Boolean))]:[];
      const L=membersL().filter(m=>!cur.includes(m.id)&&(!q||m.name.toLowerCase().includes(q)||(m.role||"").toLowerCase().includes(q)||(m.email||"").toLowerCase().includes(q)))
        .sort((a,b)=>(tm.includes(b.id)-tm.includes(a.id)));
      if(!menu){ menu=document.createElement("div"); menu.className="pmenu"; menu.setAttribute("role","listbox"); host.querySelector(".ppl").appendChild(menu); }
      sel=Math.min(sel,Math.max(0,L.length-1));
      menu.innerHTML=L.length?L.map((m,i)=>`<button type="button" role="option" data-pick="${esc(m.id)}" aria-selected="${i===sel}">${avHTML(m)}<span>${esc(m.name)}${m.id===S.meId?" (vos)":""}</span><small>${esc(tm.includes(m.id)?"equipo del tablero":(m.role||""))}</small></button>`).join(""):`<div class="empty-m">${cur.length>=membersL().length?"Ya están todos asignados.":"Nadie coincide con «"+esc(q)+"»."}</div>`;
      menu.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("mousedown",e=>{ e.preventDefault(); pick(b.dataset.pick); }));
      menu._ids=L.map(m=>m.id); };
    const closeMenu=()=>{ if(menu){ menu.remove(); menu=null; } q=""; sel=0; };
    const pick=mid=>{ closeMenu(); set([...get(),mid]); draw(true); };
    const sync=()=>{ const v=inp.value; const at=v.lastIndexOf("@"); if(at<0){ closeMenu(); return; } q=v.slice(at+1).trim().toLowerCase(); openMenu(); };
    inp.addEventListener("input",sync);
    host.querySelector("[data-padd]").addEventListener("mousedown",e=>{ e.preventDefault(); inp.focus(); if(!inp.value.includes("@")) inp.value="@"; sync(); });
    host.querySelector("[data-padd]").addEventListener("click",e=>{ e.preventDefault(); inp.focus(); if(!inp.value.includes("@")) inp.value="@"; sync(); });
    inp.addEventListener("keydown",e=>{
      if(menu&&(e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); const n=(menu._ids||[]).length; if(n){ sel=(sel+(e.key==="ArrowDown"?1:-1)+n)%n; openMenu(); } }
      else if(e.key==="Enter"){ e.preventDefault(); if(menu&&(menu._ids||[]).length) pick(menu._ids[sel]); }
      else if(e.key==="Escape"&&menu){ e.preventDefault(); e.stopPropagation(); inp.value=""; closeMenu(); }
      else if(e.key==="Backspace"&&!inp.value&&get().length){ set(get().slice(0,-1)); draw(true); }
    });
    inp.addEventListener("blur",()=>setTimeout(()=>{ if(document.activeElement!==inp){ closeMenu(); inp.value=""; } },120));
    host.querySelector(".ppl").addEventListener("mousedown",e=>{ if(e.target.classList.contains("ppl")){ e.preventDefault(); inp.focus(); } });
    if(focus) inp.focus();
  };
  draw(false); return {redraw:draw};
}

let P=null, DRAG=null, raf=0;
function pressStart(x,y,el,touch){ if(!S.canWrite) return; P={x,y,el,touch,cx:x,cy:y,t:touch?setTimeout(()=>{ if(P) begin(P.cx,P.cy); },380):0}; }
document.addEventListener("mousedown",e=>{ if(e.button!==0) return; const el=e.target.closest("[data-drag]"); if(!el||e.target.closest("button,input,select,textarea,a,[data-nodrag]")) return; pressStart(e.clientX,e.clientY,el,false); });
document.addEventListener("mousemove",e=>{ if(DRAG){ e.preventDefault(); moveTo(e.clientX,e.clientY); } else if(P&&!P.touch&&Math.hypot(e.clientX-P.x,e.clientY-P.y)>6){ e.preventDefault(); begin(e.clientX,e.clientY); } });
document.addEventListener("mouseup",()=>{ if(DRAG) end(true); P=null; });
document.addEventListener("touchstart",e=>{ if(e.touches.length>1){ if(P){clearTimeout(P.t);P=null} return; } const el=e.target.closest("[data-drag]"); if(!el||e.target.closest("button,input,select,textarea,a,[data-nodrag]")) return; const t=e.touches[0]; pressStart(t.clientX,t.clientY,el,true); },{passive:true});
document.addEventListener("touchmove",e=>{ const t=e.touches[0]; if(DRAG){ e.preventDefault(); moveTo(t.clientX,t.clientY); } else if(P){ P.cx=t.clientX;P.cy=t.clientY; if(Math.hypot(t.clientX-P.x,t.clientY-P.y)>10){ clearTimeout(P.t); P=null; } } },{passive:false});
document.addEventListener("touchend",e=>{ if(DRAG){ e.preventDefault(); end(true); } else if(P){ clearTimeout(P.t); P=null; } },{passive:false});
document.addEventListener("touchcancel",()=>{ if(DRAG) end(false); if(P){clearTimeout(P.t);P=null} });
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-drag]")&&(P||DRAG)) e.preventDefault(); });
window.addEventListener("blur",()=>{ if(DRAG) end(false); });

function begin(x,y){
  const el=P.el; clearTimeout(P.t); P=null;
  const kind=el.dataset.drag, id=kind==="task"?el.dataset.id:el.dataset.pid; const r=el.getBoundingClientRect();
  const g=el.cloneNode(true); g.classList.add("drag-ghost"); g.classList.remove("dragging"); g.removeAttribute("data-drag"); g.removeAttribute("data-drop");
  g.style.width=r.width+"px"; g.style.height=r.height+"px"; document.body.appendChild(g);
  const fromCol=el.closest("[data-member]");
  DRAG={kind,id,el,g,dx:x-r.left,dy:y-r.top,h:r.height,tgt:null,ph:null,x,y,idx:0,cards:[],from:fromCol?fromCol.dataset.member:undefined};
  el.classList.add("dragging"); document.body.classList.add("is-dragging");
  if(kind==="task") showDock();
  try{ navigator.vibrate&&navigator.vibrate(15) }catch(_){}
  moveTo(x,y); cancelAnimationFrame(raf); raf=requestAnimationFrame(autoScroll);
}
function findTarget(x,y){
  const hit=document.elementFromPoint(x,y); if(!hit) return null;
  if(DRAG.kind==="task"){ const t=hit.closest("[data-drop]"); return t&&!t.classList.contains("drag-ghost")?t:null; }
  const t=hit.closest("[data-proj]"); return t&&t.dataset.proj!==DRAG.id?t:null;
}
function moveTo(x,y){
  DRAG.x=x; DRAG.y=y; DRAG.g.style.transform=`translate(${x-DRAG.dx}px,${y-DRAG.dy}px) rotate(${DRAG.kind==="task"?2:1}deg)`;
  const t=findTarget(x,y);
  if(t!==DRAG.tgt){ DRAG.tgt&&DRAG.tgt.classList.remove("drop-on"); DRAG.tgt=t; t&&t.classList.add("drop-on"); }
  if(t&&t.dataset.drop==="col"&&DRAG.kind==="task"){
    const list=t.querySelector("[data-list]"); const cards=[...list.querySelectorAll(".card:not(.dragging)")];
    let idx=cards.length; for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(y<r.top+r.height/2){ idx=i; break; } }
    if(!DRAG.ph){ DRAG.ph=document.createElement("div"); DRAG.ph.className="ph"; DRAG.ph.style.height=Math.min(DRAG.h,120)+"px"; }
    const ref=cards[idx]||null; if(DRAG.ph.parentNode!==list||DRAG.ph.nextElementSibling!==ref) list.insertBefore(DRAG.ph,ref);
    list.querySelector(".col-empty")?.setAttribute("hidden","");
    DRAG.idx=idx; DRAG.cards=cards.map(c=>c.dataset.id);
  } else if(DRAG.ph&&DRAG.ph.parentNode){ const l=DRAG.ph.parentNode; DRAG.ph.remove(); l.querySelector(".col-empty")?.removeAttribute("hidden"); }
}
function autoScroll(){
  if(!DRAG) return; const {x,y}=DRAG; let moved=false; const E=56;
  const dock=$("#dock"); const dr=!dock.hidden?dock.getBoundingClientRect():null;
  const row=dr&&y>=dr.top&&y<=dr.bottom?document.elementFromPoint(x,y)?.closest(".dock-row"):null;
  if(row){ const r=row.getBoundingClientRect(); if(x<r.left+E){row.scrollLeft-=10;moved=true} else if(x>r.right-E){row.scrollLeft+=10;moved=true} }
  else {
    const b=document.elementFromPoint(x,y)?.closest(".board")||$(".board");
    if(b){ const r=b.getBoundingClientRect(); if(y>=r.top&&y<=r.bottom){ if(x<r.left+E){b.scrollLeft-=Math.ceil((E-(x-r.left))/3);moved=true} else if(x>r.right-E){b.scrollLeft+=Math.ceil((E-(r.right-x))/3);moved=true} } }
    const bottomEdge=dr?dr.top:innerHeight; const topEdge=($(".top")?.getBoundingClientRect().bottom)||0;
    if(y<topEdge+E&&y>topEdge-4){ window.scrollBy(0,-10); moved=true; } else if(y>bottomEdge-E&&y<bottomEdge){ window.scrollBy(0,10); moved=true; }
  }
  if(moved) moveTo(x,y);
  raf=requestAnimationFrame(autoScroll);
}
function end(commit){
  const d=DRAG; DRAG=null; cancelAnimationFrame(raf);
  d.g.remove(); d.el.classList.remove("dragging"); document.body.classList.remove("is-dragging"); d.tgt&&d.tgt.classList.remove("drop-on");
  const dock=$("#dock"); dock.hidden=true;
  if(commit&&d.tgt){ try{ d.kind==="task"?dropTask(d):dropProject(d); }catch(err){ console.warn(err); } }
  d.ph&&d.ph.remove(); S.justDragged=Date.now();
  render(); if(S.openTask) refreshTask();
}
function dropTask(d){
  const ds=d.tgt.dataset, ch={}, T=DATA().tasks;
  if(ds.drop==="col"){
    if(ds.private!==undefined&&(ds.private==="1")!==!!T[d.id].private){ toast(ds.private==="1"?"Solo se pueden hacer privadas las tareas nuevas: creala con «Agregar tarea» en esta tabla.":"Para que la vea el equipo, abrí la tarea y tocá «Hacer visible»."); return; }
    if(ds.status) ch.status=ds.status; if(ds.project!==undefined) ch.projectId=ds.project;
    if(ds.member!==undefined&&ds.member!==d.from){ const t=T[d.id], cur=asg(t), to=ds.member, fr=d.from;
      let nx=fr&&cur.includes(fr)?cur.map(x=>x===fr?to:x):(to?[...cur,to]:cur);
      if(!to) nx=cur.filter(x=>x!==fr); ch.assignees=[...new Set(nx.filter(Boolean))]; }
    const prev=T[d.cards[d.idx-1]], next=T[d.cards[d.idx]];
    ch.order=prev&&next?((prev.order||0)+(next.order||0))/2:prev?(prev.order||0)+1024:next?(next.order||0)-1024:Date.now();
  } else if(ds.drop==="set"){ if(ds.member!==undefined){ const cur=asg(T[d.id]), fr=d.from&&cur.includes(d.from)?d.from:cur[0];
      ch.assignees=cur.includes(ds.member)?cur:(fr?cur.map(x=>x===fr?ds.member:x):[ds.member]); }
    if(ds.project!==undefined) ch.projectId=ds.project; }
  else if(ds.drop==="day"){ ch.due=ds.day; }
  moveTask(d.id,ch);
}
function dropProject(d){
  const tg=d.tgt, r=tg.getBoundingClientRect(); const grid=tg.classList.contains("pcard");
  const after=grid?(d.x>r.left+r.width/2):(d.y>r.top+r.height/2);
  const L=projectsL(true).map(p=>p.id).filter(id=>id!==d.id); let i=L.indexOf(tg.dataset.proj); if(i<0) return; L.splice(i+(after?1:0),0,d.id);
  const p=DATA().projects[d.id];
  L.forEach((id,k)=>{ const o=(k+1)*1024; if(DATA().projects[id].order!==o) patch("projects",id,{order:o}); });
  log("porder",{projectId:d.id,pname:p.name}); toast("Tableros reordenados");
}
function showDock(){
  const ms=membersL(), ps=projectsL(); if(!ms.length&&!ps.length) return;
  $("#dock").innerHTML=`${ms.length?`<div class="dock-row"><span class="lbl">Pasar a</span>${ms.map(m=>`<div class="dk" data-drop="set" data-member="${esc(m.id)}">${avHTML(m)}<span>${esc(first(m.name))}</span></div>`).join("")}</div>`:""}
${ps.length?`<div class="dock-row"><span class="lbl">Mover a</span>${ps.map(p=>`<div class="dk proj" data-drop="set" data-project="${esc(p.id)}" style="${pc(p)}"><i class="sw"></i><span>${esc(p.name)}</span></div>`).join("")}</div>`:""}`;
  $("#dock").hidden=false;
}

/* ---------- conexión con Supabase ---------- */
const loginBody=h=>{ $("#loginBody").innerHTML=h; };
function showLogin(msg){
  $("#login").hidden=false;
  loginBody(`<p>El sistema de tareas del estudio.</p>
<form id="lf1" autocomplete="on"><label class="fld"><span>Tu mail</span><input class="inp" type="email" id="lemail" required autocomplete="email" inputmode="email" placeholder="nombre@ejemplo.com" value="${esc(ls.get("gab.email")||"")}"></label>
<button class="btn pri" type="submit">Recibir código por mail</button>${msg?`<p class="msg err">${esc(msg)}</p>`:""}<p class="msg">Te mandamos un código de un solo uso. No hace falta contraseña.</p></form>`);
  $("#lf1").addEventListener("submit",async e=>{ e.preventDefault(); const email=$("#lemail").value.trim().toLowerCase(); if(!okMail(email)) return;
    const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Enviando…"; ls.set("gab.email",email);
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:APP_URL}});
    if(error){ b.disabled=false; b.textContent="Recibir código por mail"; return showLogin(/rate|seconds/i.test(error.message)?"Esperá un minuto antes de pedir otro código.":"No se pudo enviar el código: "+error.message); }
    showCode(email); });
}
function showCode(email,msg){
  loginBody(`<form id="lf2"><p class="msg">Te mandamos un código a <b>${esc(email)}</b>. Revisá también la carpeta de spam.</p>
<label class="fld"><span>Código</span><input class="inp code" id="lcode" required inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]{6,10}"></label>
<button class="btn pri" type="submit">Entrar</button>${msg?`<p class="msg err">${esc(msg)}</p>`:""}<button type="button" class="link" id="lback">Usar otro mail o pedir otro código</button></form>`);
  $("#lcode").focus();
  $("#lback").onclick=()=>showLogin();
  $("#lf2").addEventListener("submit",async e=>{ e.preventDefault(); const token=$("#lcode").value.replace(/\D/g,""); const b=e.target.querySelector("button[type=submit]"); b.disabled=true; b.textContent="Verificando…";
    const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});
    if(error) return showCode(email,"El código no es válido o venció. Pedí uno nuevo.");
    startSession(data.session); });
}
function showNotMember(){
  $("#login").hidden=false;
  loginBody(`<form><p class="msg"><b>${esc(S.myEmail)}</b> todavía no está habilitado en Gabinete.</p><p class="msg">Pedile al administrador del estudio que te sume desde <b>Equipo → Gestionar equipo</b> con este mismo mail, y volvé a entrar.</p><button type="button" class="btn" id="lout">Salir</button></form>`);
  $("#lout").onclick=()=>sb.auth.signOut().then(()=>showLogin());
}
async function loadAll(){
  const [m,p,t,h]=await Promise.all([sb.from("members").select("*"),sb.from("projects").select("*"),sb.from("tasks").select("*"),sb.from("history").select("*").order("ts",{ascending:false}).limit(300)]);
  const err=m.error||p.error||t.error||h.error; if(err){ console.warn(err); return false; }
  S.L.members=Object.fromEntries(m.data.map(r=>[r.id,fromDb("members",r)]));
  S.L.projects=Object.fromEntries(p.data.map(r=>[r.id,fromDb("projects",r)]));
  S.L.tasks=Object.fromEntries(t.data.map(r=>[r.id,fromDb("tasks",r)]));
  S.L.history=h.data.map(fromHist);
  // Agenda de proveedores: si la tabla todavía no existe, el resto del sistema sigue funcionando igual
  const c=await sb.from("contacts").select("*");
  if(c.error){ console.warn(c.error); S.noContacts=true; S.L.contacts={}; }
  else { S.noContacts=false; S.L.contacts=Object.fromEntries(c.data.map(r=>[r.id,fromDb("contacts",r)])); }
  return true;
}
let rT=0; function scheduleRender(){ cancelAnimationFrame(rT); rT=requestAnimationFrame(()=>render()); }
function applyChange(coll,p){
  if(p.eventType==="DELETE"){ if(p.old&&p.old.id) delete S.L[coll][p.old.id]; }
  else S.L[coll][p.new.id]=fromDb(coll,p.new);
  if(coll==="members"){ const me=S.L.members[S.meId]; S.isAdmin=!!(me&&me.isAdmin); if(!me) return showNotMember(); }
  scheduleRender();
}
function bcastResync(){ try{ S.ch&&S.ch.send({type:"broadcast",event:"resync",payload:{}}); }catch(_){} }
function subscribe(){
  if(S.ch) sb.removeChannel(S.ch);
  S.ch=sb.channel("gabinete",{config:{broadcast:{self:false}}})
    .on("broadcast",{event:"resync"},()=>{ clearTimeout(S.rsT); S.rsT=setTimeout(resync,400); })
    .on("broadcast",{event:"update"},({payload})=>{ if(payload&&payload.v&&payload.v!==APP_VERSION) showUpdateBar(); else checkUpdate(false); })
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},p=>applyChange("tasks",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"projects"},p=>applyChange("projects",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"members"},p=>applyChange("members",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"contacts"},p=>applyChange("contacts",p))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"history"},p=>{ const e=fromHist(p.new); const i=S.L.history.findIndex(x=>x.cid&&x.cid===e.cid); if(i>=0) S.L.history[i]=e; else S.L.history.unshift(e); if(S.view==="hist") scheduleRender(); })
    .subscribe();
}
let syncing=false;
async function resync(){ if(syncing||!S.session) return; syncing=true; try{ if(await loadAll()) render(); } finally{ syncing=false; } }
async function startSession(session){
  S.session=session; S.myEmail=(session.user.email||"").toLowerCase();
  loginBody(`<p>Entrando…</p>`);
  await sb.rpc("link_member");
  if(!await loadAll()){ return showLogin("No se pudo conectar con la base de datos. Revisá la conexión y volvé a intentar."); }
  const me=Object.values(S.L.members).find(m=>(m.email||"").toLowerCase()===S.myEmail);
  if(!me) return showNotMember();
  S.meId=me.id; S.isAdmin=!!me.isAdmin; S.canWrite=true; S.mode="live";
  $("#login").hidden=true;
  renderTop(); go(S.view||"home"); subscribe(); setTimeout(pushAuto,1500); setTimeout(maybeNews,700);
  if(!projectsL().length) setTimeout(()=>projModal(null,"obra"),300);
}
async function loadOlder(){
  const all=[...S.L.history,...S.histOlder]; const last=all[all.length-1]; if(!last) return;
  const {data,error}=await sb.from("history").select("*").lt("ts",new Date(last.ts).toISOString()).order("ts",{ascending:false}).limit(300);
  if(error) return onErr(error);
  const more=data.map(fromHist); S.histOlder.push(...more); if(more.length<300) S.histEnd=true; render();
}
/* ---------- notificaciones push ----------
   Cada dispositivo se suscribe una vez (con permiso de la persona). Al asignar una tarea, la función
   "push" de Supabase avisa a los dispositivos de los responsables. En iPhone funciona solo con
   Gabinete agregado a la pantalla de inicio (iOS 16.4 o más nuevo). */
const PUSH_FN=SUPA_URL+"/functions/v1/push";
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushCan=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const pushState=()=>!pushCan()?(isIOS&&!standalone?"ios-browser":"unsupported"):Notification.permission==="denied"?"denied":(Notification.permission==="granted"&&ls.get("gab.push")==="on")?"on":"off";
async function pushCall(body){ const {data:{session}}=await sb.auth.getSession(); if(!session) throw new Error("Sin sesión");
  const r=await fetch(PUSH_FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA_KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }
const u8=b=>{ const s=atob(b.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((b.length+3)%4)); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function pushSubscribe(silent){
  const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){ const {publicKey}=await pushCall({action:"key"}); sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(publicKey)}); }
  await pushCall({action:"subscribe",sub:sub.toJSON(),ua:navigator.userAgent}); ls.set("gab.push","on");
  if(!silent) toast("Notificaciones activadas en este dispositivo");
}
async function enablePush(){
  const st=pushState();
  if(st==="ios-browser") return toast("En iPhone: Compartir → «Agregar a inicio», abrí Gabinete desde ese ícono y activá ahí.");
  if(st==="unsupported") return toast("Este navegador no admite notificaciones.");
  try{ const perm=await Notification.requestPermission();
    if(perm!=="granted"){ if(perm==="denied") pushHelp(); else toast("No se activaron las notificaciones."); render(); return; }
    await pushSubscribe(false);
  }catch(e){ console.warn(e); toast("No se pudieron activar las notificaciones: "+(e.message||e)); }
  render(); if($("#layer").innerHTML&&$("#pushRow")) profileModal();
}
function pushHelp(){
  const and=/Android/i.test(navigator.userAgent), app=standalone;
  const steps=isIOS?[
    "Abrí <b>Ajustes</b> del iPhone → <b>Notificaciones</b> → <b>Gabinete</b> y activá <b>Permitir notificaciones</b>.",
    "Si no aparece Gabinete en esa lista: en Safari, tocá Compartir → <b>Agregar a inicio</b>, y abrí Gabinete desde ese ícono.",
    "Volvé a Gabinete → <b>Mi cuenta</b> → <b>Activar</b> → <b>Permitir</b>."]
  :and?[
    app?"Mantené apretado el ícono de <b>Gabinete</b> en la pantalla de inicio → <b>Información de la app</b> (ⓘ) → <b>Notificaciones</b> → activalas.":"Abrí <b>Ajustes</b> del celular → <b>Aplicaciones</b> → <b>Chrome</b> (o el navegador que uses) → <b>Notificaciones</b> → activalas.",
    "En Chrome, entrá a <b>estudio-maker.github.io/gabinete</b>, tocá el ícono a la izquierda de la dirección (⚙ o candado) → <b>Permisos</b> → <b>Notificaciones</b> → <b>Permitir</b>. Si no lo ves: menú ⋮ → <b>Configuración</b> → <b>Configuración de sitios</b> → <b>Notificaciones</b> y sacá el sitio de <b>Bloqueados</b>.",
    "Si abriste Gabinete desde un link de WhatsApp o del mail, abrilo directamente en Chrome (menú ⋮ → <b>Abrir en Chrome</b>).",
    "Volvé a Gabinete → <b>Mi cuenta</b> → <b>Activar</b> → <b>Permitir</b>, y tocá <b>Probar</b>."]
  :[
    "Hacé clic en el ícono a la izquierda de la dirección del sitio (candado o ⚙) → <b>Notificaciones</b> → <b>Permitir</b>.",
    "Recargá la página y volvé a <b>Mi cuenta</b> → <b>Activar</b>, y tocá <b>Probar</b>."];
  modal(`<div class="sheet-h"><span style="color:var(--accent)">${ic("bell")}</span><h2>Habilitar notificaciones</h2><span class="sp"></span><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
<div class="sheet-b"><p style="margin:0">Este ${isIOS||and?"celular":"navegador"} está bloqueando las notificaciones de Gabinete, por eso no te puede preguntar. Se habilitan así:</p>
<ol style="margin:0;padding-left:20px;display:grid;gap:10px;font-size:13.5px;line-height:1.5">${steps.map(x=>`<li>${x}</li>`).join("")}</ol>
<div class="row"><span class="sp"></span><button class="btn pri" data-act="close">Entendido</button></div></div>`,"narrow");
}
async function disablePush(){ try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){ await pushCall({action:"unsubscribe",endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe(); } }catch(_){}
  ls.set("gab.push","off"); toast("Notificaciones desactivadas en este dispositivo"); profileModal(); }
async function pushTest(){ try{ const j=await pushCall({action:"test"}); toast(j.sent?"Te mandamos una notificación de prueba":"No se encontró este dispositivo. Desactivá y volvé a activar."); }catch(e){ toast("No se pudo probar: "+(e.message||e)); } }
function pushNotify(id,ids){ if(!ids||!ids.length) return; pushCall({action:"notify",taskId:id,to:ids}).catch(e=>console.warn("push",e)); }
function pushAuto(){ if(pushState()==="on") pushSubscribe(true).catch(e=>console.warn("push",e)); }
function pushBanner(){
  if(S.view!=="home"||ls.get("gab.pushask")==="no") return "";
  const st=pushState(); if(st==="on"||st==="denied"||st==="unsupported") return "";
  if(st==="ios-browser") return `<div class="pushbar">${ic("bell")}<span style="flex:1;min-width:200px">Para recibir avisos en el iPhone: tocá <b>Compartir → Agregar a inicio</b> y abrí Gabinete desde ese ícono.</span><button class="btn ghost sm" data-act="pushLater">Entendido</button></div>`;
  return `<div class="pushbar">${ic("bell")}<span style="flex:1;min-width:200px">Activá las notificaciones para enterarte al instante cuando te asignen una tarea.</span><button class="btn ghost sm" data-act="pushLater">Ahora no</button><button class="btn pri sm" data-act="pushOn">Activar</button></div>`;
}
navigator.serviceWorker&&navigator.serviceWorker.addEventListener("message",e=>{ const u=e.data&&e.data.open; if(u){ const m=u.match(/#tarea-([0-9a-f-]{36})/); if(m&&DATA().tasks[m[1]]) taskModal(m[1]); } });

/* ---------- actualizaciones automáticas ----------
   Cuando se publica una versión nueva, cada dispositivo la detecta solo. Si la persona vuelve a abrir
   la app (y no está editando nada) se recarga sola; si la está usando, aparece un aviso para actualizar.
   Los datos viven en la base, así que recargar nunca borra nada. */
let updFound=false;
async function checkUpdate(onReturn){
  if(!navigator.onLine) return;
  try{ const r=await fetch(APP_URL+"index.html?v="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
    const m=(await r.text()).match(/const APP_VERSION="([^"]+)"/); if(!m||m[1]===APP_VERSION) return; updFound=true;
  }catch(_){ return; }
  const busy=DRAG||$("#layer").innerHTML||S.quickOpen||(document.activeElement&&document.activeElement.matches("input,textarea,select"));
  if(onReturn&&!busy) return hardReload();
  showUpdateBar();
}
function showUpdateBar(){ if($("#updBar")) return; const d=document.createElement("div"); d.id="updBar"; d.className="update-bar"; d.setAttribute("role","status");
  d.innerHTML=`${ic("bell")}<span>Hay una versión nueva de Gabinete</span><button data-act="reload">Actualizar</button>`; document.body.appendChild(d); }
async function notifyUpdateAll(){
  try{ S.ch&&S.ch.send({type:"broadcast",event:"update",payload:{v:APP_VERSION}}); }catch(_){}
  let msg="Aviso enviado a quienes tienen Gabinete abierto";
  try{ const j=await pushCall({action:"update_all"}); msg+=` y a ${j.sent} ${j.sent===1?"dispositivo":"dispositivos"} con notificaciones`; }catch(e){ msg+=" (las notificaciones push no se pudieron enviar: "+(e.message||e)+")"; }
  toast(msg); log("member",{what:"avisó a todo el equipo que actualice Gabinete"});
}
async function hardReload(){ try{ await Promise.all([fetch(APP_URL,{cache:"reload"}),fetch(APP_URL+"index.html",{cache:"reload"})]); }catch(_){} location.reload(); }
async function boot(){
  if(/[?&]actualizar=/.test(location.search)) try{ history.replaceState(null,"",location.pathname+location.hash); }catch(_){}
  $("#loginLogo").src=LOGO;
  if(!window.supabase){ loginBody(`<p>No se pudo cargar el sistema. Revisá la conexión a internet y recargá la página.</p>`); return; }
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==="SIGNED_OUT"){ S.session=null; showLogin(); } else if(ses) S.session=ses; });
  if(session) startSession(session); else showLogin();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ resync(); checkUpdate(true); } });
  setInterval(()=>checkUpdate(false),5*60*1000); setInterval(()=>{ if(S.view==="home"&&!DRAG) render(); },30*60*1000); setTimeout(()=>checkUpdate(false),20000);
  addEventListener("online",()=>{ resync(); render(); }); addEventListener("offline",()=>render());
}
addEventListener("hashchange",()=>{ const m=location.hash.match(/^#tarea-([0-9a-f-]{36})$/); if(m&&S.session){ if(DATA().tasks[m[1]]) taskModal(m[1]); else toast("Esa tarea ya no existe."); } });
renderTabbar(); boot();
})();
</script>
