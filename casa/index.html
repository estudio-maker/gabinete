<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Misma familia visual que Gabinete: barra lateral carbón, área de trabajo clara, columnas como hojas. */
:root{
  --paper:#ECEEEC; --sheet:#FFFFFF; --colbg:#F5F6F4; --ink:#16191B; --ink2:#4A5257; --ink3:#7C858A;
  --line:#D6DBD9; --line2:#E6E9E7; --grid:rgba(31,94,91,.06);
  --band:#1E2326; --bandfg:#EEF0EE; --bandline:rgba(255,255,255,.12); --bandhover:rgba(255,255,255,.06); --bandsel:rgba(255,255,255,.12);
  --accent:#1F5E5B; --accent2:#2D7D78; --accentbg:#E1EDEB; --tape:#F2B705; --tapebg:#FFF3C7; --tapefg:#1E2326;
  --ok:#2E7D4F; --okbg:#E0F1E6; --warn:#9A5D00; --warnbg:#FCEDD3; --bad:#B3261E; --badbg:#FBE3E0;
  --st-todo:#7C858A; --st-doing:#2D7D78; --st-review:#D49A00; --st-done:#2E7D4F;
  --c0:#1F5E5B; --c1:#B8641A; --c2:#3E5C9A; --c3:#8A4F7D; --c4:#5C7A2C; --c5:#B3443A; --c6:#2B7A91; --c7:#6B6258;
  --avfg:#FFFFFF;
  --shadow:0 1px 1px rgba(22,25,27,.04),0 2px 6px rgba(22,25,27,.05);
  --lift:0 18px 40px rgba(22,25,27,.28);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --side:252px; --colw:292px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#1A1F22; --colbg:#151A1C; --ink:#E8ECEB; --ink2:#AEB6B8; --ink3:#7F898C;
  --line:#2C3337; --line2:#232A2D; --grid:rgba(111,194,187,.045);
  --band:#0A0C0D; --bandfg:#E8ECEB;
  --accent:#6FC2BB; --accent2:#4FA59E; --accentbg:#16302E; --tape:#F2C230; --tapebg:#3A3010; --tapefg:#1E2326;
  --ok:#6CC28F; --okbg:#173325; --warn:#F0B451; --warnbg:#3A2A0E; --bad:#F08A80; --badbg:#3D1A17;
  --st-todo:#8C969A; --st-doing:#4FB3AA; --st-review:#E8B32E; --st-done:#5DBA84;
  --c0:#4FB3AA; --c1:#E09A55; --c2:#7E9BD8; --c3:#C58CB8; --c4:#9CBA62; --c5:#E57E73; --c6:#62B4CC; --c7:#AFA497;
  --avfg:#101315;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --lift:0 18px 40px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:23px;font-weight:800} h2{font-size:18px;font-weight:750} h3{font-size:14px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;font-weight:700;color:var(--ink3)}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.ic{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--band);color:var(--bandfg);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px}
.brand{display:grid;gap:12px;padding:2px 8px 16px;border-bottom:1px solid var(--bandline)}
.brand img{width:128px;height:auto;display:block}
.brand .sys{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.brand span{font-size:11px;opacity:.6}
.nav{display:grid;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;opacity:.78;width:100%}
.nav button:hover{opacity:1;background:var(--bandhover)}
.nav button[aria-current="page"]{opacity:1;background:var(--bandsel);box-shadow:inset 3px 0 0 var(--tape)}
.nav button:focus-visible{outline:2px solid var(--tape)}
.nav .ic{width:18px;height:18px}
.nav .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.65}
.side-sec{display:grid;gap:1px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px;font-family:var(--f-display);font-stretch:78%;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;opacity:.55;font-weight:700}
.side-h button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;opacity:1}
.side-h button:hover{background:var(--bandhover)}
.pitem{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;opacity:.82;user-select:none;-webkit-user-select:none}
.pitem:hover{background:var(--bandhover);opacity:1}
.pitem[aria-current="page"]{background:var(--bandsel);opacity:1}
.pitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .cd{font-family:var(--f-mono);font-size:10.5px;opacity:.55}
.pitem .k{font-family:var(--f-mono);font-size:11px;opacity:.6}
.pitem.drop-on{background:var(--tape);color:var(--tapefg);opacity:1}
.sw{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none;display:inline-block}
.side-empty{padding:4px 10px;font-size:12px;opacity:.55}
.me-box{margin-top:auto;border-top:1px solid var(--bandline);padding:12px 8px 0;display:flex;gap:10px;align-items:center;font-size:12.5px}
.me-box .who{flex:1;min-width:0;display:grid}
.me-box .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box .who span{opacity:.6;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-box button{all:unset;cursor:pointer;font-size:11.5px;opacity:.7;text-decoration:underline;text-underline-offset:2px}

.main{min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .mk{display:none;width:30px;height:30px;border-radius:7px}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .me-mini{display:none}
.search{display:flex;align-items:center;gap:7px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:250px;color:var(--ink3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0;flex:1}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--tapebg);color:var(--ink);border:1px dashed var(--tape);font-size:13px}
.banner b{font-weight:600}
.banner.ro{background:var(--accentbg);border-color:var(--accent)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tapefg);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;min-height:28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.inp{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 9px;min-width:0;width:100%;min-height:36px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accentbg)}
textarea.inp{resize:vertical;line-height:1.45}
.fld{display:grid;gap:5px;font-size:12px;color:var(--ink2);min-width:0}
.fld>span{font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;background:var(--sheet)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;background:var(--pc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* avatars & chips */
.av{width:24px;height:24px;border-radius:50%;background:var(--ac,var(--c7));color:var(--avfg);display:inline-grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-display);font-stretch:85%;letter-spacing:.04em;flex:none;line-height:1}
.av.lg{width:34px;height:34px;font-size:12.5px}
.av.none{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2);max-width:100%;min-width:0}
.chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.tag{font-size:10.5px;font-family:var(--f-display);font-stretch:82%;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--ink3);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:2px 24px 18px;margin-inline:-24px;align-items:flex-start;scroll-snap-type:x proximity;scroll-padding-inline:24px;min-height:50vh;overscroll-behavior-x:contain}
.col{flex:0 0 var(--colw);background:var(--colbg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;scroll-snap-align:start;min-width:0;transition:border-color .12s,box-shadow .12s}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;min-width:0}
.col-h h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .who{display:grid;min-width:0;flex:1}
.col-h .n{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:auto}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--stc)}
.col-list{display:flex;flex-direction:column;gap:8px;padding:2px 8px 8px;min-height:52px}
.col-empty{border:1.5px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;font-size:12px;color:var(--ink3)}
.col.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.col-more{font-size:12px;color:var(--ink3);padding:0 12px 10px}
.quick{padding:0 8px 8px;display:grid;gap:6px}
.quick>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;color:var(--ink2);font-size:13px}
.quick>button:hover{background:var(--line2);color:var(--ink)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 11px 9px;display:grid;gap:7px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.card:hover{border-color:var(--ink3)}
.card.dragging{opacity:.28}
.card .meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;min-width:0}
.ttl{display:flex;gap:8px;align-items:flex-start;min-width:0}
.ttl .t{font-size:13.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.chk{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;box-sizing:border-box}
.chk .ic{width:12px;height:12px}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.chk.lg{width:24px;height:24px}
.chk.lg .ic{width:15px;height:15px}
.card.done .t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);min-height:22px}
.due{font-family:var(--f-mono);font-size:11px;display:inline-flex;gap:4px;align-items:center;padding:1px 6px;border-radius:4px;background:var(--line2);white-space:nowrap}
.due .ic{width:12px;height:12px}
.due.over{background:var(--badbg);color:var(--bad)} .due.today{background:var(--tapebg);color:var(--warn)}
.prio{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.prio .ic{width:12px;height:12px}
.prio.p1{color:var(--warn)} .prio.p2{color:var(--bad)}
.cl{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px}
.cl .ic{width:13px;height:13px}
.cl.full{color:var(--ok)}
.dim{color:var(--ink3)}

.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;margin:0;box-shadow:var(--lift);border-color:var(--accent);opacity:.97;cursor:grabbing}
.ph{border:2px dashed var(--accent);border-radius:8px;background:var(--accentbg);flex:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging .card:hover{border-color:var(--line)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:250;background:var(--band);color:var(--bandfg);border-radius:14px;padding:10px 12px;display:grid;gap:8px;width:min(760px,calc(100vw - 24px));box-shadow:var(--lift)}
.dock-row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.dock-row::-webkit-scrollbar{display:none}
.dock .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.6;font-family:var(--f-display);font-stretch:80%;font-weight:700;white-space:nowrap;min-width:64px}
.dk{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--bandsel);font-size:12.5px;white-space:nowrap;flex:none;transition:background .1s,transform .1s}
.dk.proj{padding-left:10px}
.dk.drop-on{background:var(--tape);color:var(--tapefg);transform:scale(1.06)}

/* tiles */
.hello{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hello .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s}
button.stat:hover{border-color:var(--ink3)}
button.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.hfsec{display:grid;gap:10px;scroll-margin-top:70px}
.hflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;align-items:start}

.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h .sp{flex:1}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow);min-width:0;transition:border-color .12s}
.pcard:hover{border-color:var(--ink3)}
.pcard.dragging{opacity:.3}
.pcard.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.pcard.arch{opacity:.6} .card.arch{opacity:.55}
.pcard .hd{display:flex;gap:10px;align-items:flex-start}
.pcard .hd .nm{flex:1;min-width:0;display:grid;gap:2px}
.pcard h3{font-size:16px;overflow-wrap:anywhere}
.pcard .cli{font-size:12px;color:var(--ink3)}
.stamp{border:1.5px solid var(--ink);padding:2px 6px;font-family:var(--f-mono);font-size:11px;line-height:1.2;text-align:center;display:grid;flex:none;border-radius:2px}
.stamp small{font-family:var(--f-display);font-stretch:80%;font-size:9px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);margin:0 -6px 2px;padding:0 6px 1px}
.meter{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:3px}
.pcard .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.avs{display:flex}
.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--sheet)}
.avs .av:first-child{margin-left:0}
.pnew{border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;gap:6px;padding:24px;color:var(--ink2);cursor:pointer;background:transparent;font-size:13.5px;min-height:150px}
.pnew:hover{border-color:var(--accent);color:var(--accent)}

.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phead .nm{display:grid;gap:2px;min-width:0;flex:1}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pteam{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pteam .lb{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.11em;font-size:10.5px;font-weight:700;color:var(--ink3)}
.pteam .grp{display:flex;gap:8px;align-items:center;min-width:0}
.pteam .lead{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:500}
.pteam.none{border-style:dashed}
.avbtn{all:unset;cursor:pointer;border-radius:50%;display:inline-grid}
.avbtn:hover .av{box-shadow:0 0 0 2px var(--accent)}
.avbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.who-tag{display:inline-flex!important;align-items:center;gap:5px;padding:1px 8px 1px 1px;border-radius:99px!important;background:var(--line2);max-width:120px;min-width:0}
.who-tag .an{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-tag .av{width:20px;height:20px;font-size:9px}
.who-tag.none{background:transparent;border:1px dashed var(--line);padding-left:2px}
.who-tag.none .an{color:var(--ink3);font-weight:500}
.who-tag:hover{background:var(--accentbg)}
.who-tag:hover .av{box-shadow:none}
.pick.on{border-color:var(--accent);background:var(--accentbg)}
.pick .tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink3);display:grid;place-items:center;color:transparent;flex:none}
.pick.on .tick{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.leadbtn{all:unset;cursor:pointer;font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.leadbtn[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tapefg);font-weight:600}
.leadbtn:disabled{opacity:.35;cursor:default}
.mgrp{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.11em;font-size:10.5px;font-weight:700;color:var(--ink3);padding:6px 2px 2px}
.fav{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:grid}
.fav[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.fav[aria-pressed="false"].dimmed{opacity:.4}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{min-width:170px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
.cal .dw{background:var(--colbg);padding:7px 8px;font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:700;color:var(--ink3);border-bottom:1px solid var(--line)}
.cal .d{background:var(--sheet);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transition:background .1s}
.cal .d:hover{background:var(--colbg)}
.cal .d.out{background:var(--colbg)}
.cal .d.out .dn{opacity:.45}
.cal .d.we{background:color-mix(in srgb,var(--colbg) 60%,var(--sheet))}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.drop-on{background:var(--accentbg)}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--ink2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.d.today .dn{background:var(--tape);color:var(--tapefg);font-weight:600}
.cc{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--colbg);min-width:0;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{flex-direction:column;align-items:stretch;gap:0;border-left:3px solid var(--pc)}
.cc .cb{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);font-size:12px;max-width:100%}
.legend button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend button .k{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.legend button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend.filtering button[aria-pressed="false"]{opacity:.45}
.bgroup{display:grid;gap:8px}
.bgroup>h3{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.bgroup>h3 .k{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:0}
.nodate{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:16px}
.cc.done span{text-decoration:line-through;color:var(--ink3)}
.cc.dragging{opacity:.3}
.dchips{display:grid;gap:3px;min-width:0}
.cmore{font-size:11px;color:var(--ink3);padding-left:4px}
.ddots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.ddots i{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.daypanel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.daylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}

/* history */
.hfil{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.hfil .fld{width:220px;max-width:100%}
.hgroup{display:grid;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hgroup>h3{padding:9px 14px;background:var(--colbg);border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow .tx{min-width:0;overflow-wrap:anywhere}
.hrow .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)}
.hrow a,.alink{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.hrow a:hover,.alink:hover{text-decoration:underline}
.hk{display:inline-block;font-family:var(--f-display);font-stretch:80%;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:0 5px;border-radius:3px;margin-right:4px;background:var(--line2);color:var(--ink2);vertical-align:1px}
.hk.done{background:var(--okbg);color:var(--ok)} .hk.move{background:var(--accentbg);color:var(--accent)} .hk.del{background:var(--badbg);color:var(--bad)} .hk.new{background:var(--tapebg);color:var(--warn)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,13,.5);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.sheet{background:var(--sheet);border-radius:12px;width:100%;max-width:660px;max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:var(--lift);display:flex;flex-direction:column}
.sheet.narrow{max-width:480px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:2}
.sheet-b{padding:16px 18px 22px;display:grid;gap:16px}
.ttl-inp{font-family:var(--f-display);font-stretch:88%;font-size:20px;font-weight:700;border-color:transparent;padding:4px 6px;margin-left:-6px;width:calc(100% + 6px);resize:none;overflow:hidden}
.ttl-inp:hover{border-color:var(--line)}
.checklist{display:grid;gap:2px}
.ci{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:5px}
.ci:hover{background:var(--colbg)}
.ci span{flex:1;min-width:0;overflow-wrap:anywhere}
.ci.d span{text-decoration:line-through;color:var(--ink3)}
.ci-in{all:unset;flex:1;min-width:0;padding:3px 6px;border-radius:5px;border:1px solid transparent;cursor:text;line-height:1.4}
.ci-in:hover{border-color:var(--line)}
.ci-in:focus{border-color:var(--accent);background:var(--sheet);box-shadow:0 0 0 2px var(--accentbg)}
.ci.d .ci-in{text-decoration:line-through;color:var(--ink3)}
.ci .ci-h{width:22px;height:28px;display:grid;place-items:center;color:var(--ink3);cursor:grab;touch-action:none;border-radius:5px;flex:none;-webkit-user-select:none;user-select:none}
.ci .ci-h:hover{background:var(--line2);color:var(--ink)}
.ci.ci-drag{background:var(--sheet);box-shadow:var(--lift);position:relative;z-index:2;opacity:.96}
.ci.ci-drag .ci-h{cursor:grabbing}
.ppl{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);min-height:42px}
.ppl:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentbg)}
.ppl .pchip{display:inline-flex;align-items:center;gap:6px;padding:2px 4px 2px 2px;border-radius:99px;background:var(--line2);font-size:12.5px;font-weight:600;max-width:100%}
.ppl .pchip .av{width:22px;height:22px;font-size:9px}
.ppl .pchip button{all:unset;cursor:pointer;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;color:var(--ink3)}
.ppl .pchip button:hover{background:var(--line);color:var(--ink)}
.ppl .pchip .ic{width:12px;height:12px}
.ppl input{all:unset;flex:1;min-width:150px;padding:4px 6px;font-size:13.5px}
.ppl input::placeholder{color:var(--ink3)}
.pmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--lift);padding:4px;display:grid;gap:2px;max-height:260px;overflow:auto}
.pmenu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:7px;font-size:13px}
.pmenu button small{color:var(--ink3);font-size:11.5px;margin-left:auto;white-space:nowrap}
.pmenu button[aria-selected="true"],.pmenu button:hover{background:var(--accentbg)}
.pmenu .empty-m{padding:8px;color:var(--ink3);font-size:12.5px}
.who-tag .avst{display:flex}
.who-tag .avst .av{margin-left:-7px;box-shadow:0 0 0 2px var(--line2)}
.who-tag .avst .av:first-child{margin-left:0}
.priv-b{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);padding:1px 6px 1px 4px;border-radius:5px;background:var(--line2)}
.priv-b .ic{width:12px;height:12px}
.card.is-priv{border-left:3px solid var(--ink3)}
.privsec{display:grid;gap:12px;padding:14px;border:1px dashed var(--line);border-radius:12px;background:var(--colbg)}
.privsec .sec-h h2{display:flex;align-items:center;gap:8px}
.privsec.hid .board{display:none}
.privtog{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;background:var(--sheet)}
.privtog[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.privtog .ic{width:18px;height:18px}
.pushbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accentbg);color:var(--ink);font-size:13px}
.pushbar .ic{color:var(--accent)}
.ci .icon-btn{width:26px;height:26px;opacity:.5}
.ci:hover .icon-btn{opacity:1}
.acts{display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.acts div{display:flex;gap:8px;align-items:baseline}
.acts .tm{font-family:var(--f-mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--badbg);color:var(--bad);padding:8px 10px;border-radius:7px;font-size:13px}
.mlist{display:grid;gap:4px}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;border:1px solid var(--line2)}
.mrow .nm{flex:1;min-width:0;display:grid}
.mrow .nm span{font-size:12px;color:var(--ink3)}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid var(--line);width:100%}
.pick:hover{border-color:var(--accent);background:var(--accentbg)}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

.empty{padding:36px 16px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center;background:var(--sheet);border:1px dashed var(--line);border-radius:12px}
.empty h2{color:var(--ink)}
.empty p{margin:0;max-width:46ch}
.loading{padding:60px 16px;text-align:center;color:var(--ink2)}

.notify{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:260;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:min(440px,calc(100vw - 32px))}
.notify .tx{flex:1;min-width:160px;font-size:13px}
.notify .tx b{font-weight:600}
.mailrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.mailrow .addr{font-family:var(--f-mono);font-size:12px;user-select:all;-webkit-user-select:all}
.mailprev{background:var(--colbg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;user-select:text;-webkit-user-select:text;max-height:220px;overflow:auto}
.login{position:fixed;inset:0;z-index:500;background:var(--band);color:var(--bandfg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.login .box{width:100%;max-width:400px;display:grid;gap:18px}
.login img.lg{width:170px;justify-self:center}
.login h1{color:var(--bandfg);text-align:center;font-size:26px;letter-spacing:.12em;text-transform:uppercase;font-stretch:75%}
.login p{margin:0;text-align:center;opacity:.75;font-size:14px}
.login form{display:grid;gap:10px;background:var(--sheet);color:var(--ink);border-radius:12px;padding:18px}
.login .inp{font-size:16px;min-height:44px}
.login .code{font-family:var(--f-mono);letter-spacing:.3em;text-align:center;font-size:22px}
.login .btn{min-height:44px;font-size:15px}
.login .msg{font-size:13px;color:var(--ink2);text-align:left;opacity:1}
.login .err{color:var(--bad)}
.login .link{all:unset;cursor:pointer;color:var(--accent);font-size:13px;text-align:center;text-decoration:underline}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--band);color:var(--bandfg);padding:10px 16px;border-radius:8px;z-index:400;font-size:13px;box-shadow:var(--lift);max-width:calc(100vw - 32px)}
.tabbar{display:none}
.fab{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* proveedores / contratistas */
.prov-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--ink2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.prov-chip:hover{border-color:var(--accent);color:var(--accent)}
.prov-chip .ic{width:13px;height:13px}
.prov-chip.wait{border-color:var(--tape);background:var(--tapebg);color:var(--ink)}
.plist{display:grid;gap:6px}
.prow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--sheet)}
.prow .pi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accentbg);color:var(--accent);flex:none}
.prow .nm{flex:1;min-width:0;display:grid}
.prow .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow a{color:var(--accent);text-decoration:none}
.okbtn{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--tape);background:var(--tapebg);color:var(--ink);white-space:nowrap}
.okbtn[aria-pressed="true"]{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.okbtn:disabled{cursor:default}
.ppick{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.ppick .res{display:grid;gap:4px;max-height:220px;overflow:auto}
.ppick .res button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;border:1px solid var(--line2);font-size:13px}
.ppick .res button:hover,.ppick .res button:focus-visible{border-color:var(--accent);background:var(--accentbg)}
.ppick .res button small{color:var(--ink3);font-size:12px}
.ppick .res .new{border-style:dashed;color:var(--accent);font-weight:600}
.imp{display:grid;gap:8px}
.imp .row{gap:6px}
.imphelp{background:var(--accentbg);border-radius:8px;padding:10px 12px;line-height:1.5}
.implist{display:grid;gap:6px}
.implist .res{display:grid;gap:4px;max-height:240px;overflow:auto}
.implist .res button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;border:1px solid var(--line2);font-size:13px}
.implist .res button:hover,.implist .res button:focus-visible{border-color:var(--accent);background:var(--accentbg)}
.implist .res button small{color:var(--ink3);font-size:12px}
.ctl{display:grid;gap:10px}
.ctl-row{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:10px}
.ctl-row.late{border-left:3px solid var(--bad)}
.ctl-row.on{box-shadow:0 0 0 3px var(--accentbg);border-color:var(--accent)}
.ctl-who{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.ctl-who .nm{flex:1;min-width:0;display:grid}
.ctl-who .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl-who .nm span{font-size:12px;color:var(--ink3)}
.ctl-chev{color:var(--ink3)}
.ctl-nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ctl-n{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:1px;padding:6px 8px;border-radius:8px;border:1px solid var(--line2);min-width:0}
.ctl-n b{font-family:var(--f-mono);font-size:18px;font-weight:500;line-height:1.1}
.ctl-n span{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl-n:hover{border-color:var(--ink3)}
.ctl-n[aria-pressed="true"]{border-color:var(--accent);background:var(--accentbg)}

/* ---------- repeticiones ----------
   Una tarea o recordatorio con repetición aparece en cada día que le toca; "hechas" guarda qué días ya se hicieron
   (clave = fecha, o "x" para las tareas sin fecha). */
function occurs(it,d){
  if(!it.fecha||d<it.fecha) return false;
  const D=pYmd(d), F=pYmd(it.fecha);
  switch(it.rep){
    case "dia": return true;
    case "sem": return ((it.dias&&it.dias.length)?it.dias:[F.getDay()]).includes(D.getDay());
    case "mes": { const last=new Date(D.getFullYear(),D.getMonth()+1,0).getDate(); return D.getDate()===Math.min(F.getDate(),last); }
    case "anio": return D.getMonth()===F.getMonth()&&D.getDate()===F.getDate();
    default: return d===it.fecha;
  }
}
const hechaKey=t=>t.fecha?t.fecha:"x";
const isDone=(it,d)=>!!((it.hechas||{})[d]);
const repeats=it=>it.rep&&it.rep!=="no";
function nextOcc(it,from=TODAY(),max=400){ for(let i=0;i<max;i++){ const d=addD(from,i); if(occurs(it,d)&&!isDone(it,d)) return d; } return null; }
const tareas=()=>all("tarea").filter(t=>!t.archivada);
/* instancias de tareas de un día: las que tocan ese día, y si es hoy también las atrasadas y las sin fecha */
function instDay(d,who){
  const out=[], hoy=d===TODAY();
  for(const t of tareas()){
    if(who!==undefined&&(t.resp||"")!==who) continue;
    if(occurs(t,d)) out.push({t,d});
    else if(hoy&&!repeats(t)&&t.fecha&&t.fecha<d&&!isDone(t,t.fecha)) out.push({t,d:t.fecha,late:true});
    else if(hoy&&!t.fecha&&!isDone(t,"x")) out.push({t,d:"x"});
  }
  return out.sort((a,b)=>(isDone(a.t,a.d)-isDone(b.t,b.d))||((b.late?1:0)-(a.late?1:0))||String(a.t.hora||"99").localeCompare(String(b.t.hora||"99"))||(a.t.creada||0)-(b.t.creada||0));
}
function repLabel(it){
  if(!repeats(it)) return "";
  if(it.rep==="dia") return "Todos los días";
  if(it.rep==="sem"){ const ds=(it.dias&&it.dias.length)?it.dias:[pYmd(it.fecha).getDay()]; return ds.length===7?"Todos los días":WEEK.filter(x=>ds.includes(x)).map(x=>DIA[x].slice(0,3)).join(" · "); }
  if(it.rep==="mes") return "Cada mes, el "+pYmd(it.fecha).getDate();
  if(it.rep==="anio") return "Cada año, el "+fmtD(it.fecha);
  return "";
}

const visitas=k=>all("visita").filter(v=>!k||v.servicio===k).sort((a,b)=>b.fecha.localeCompare(a.fecha)||String(b.llegada||"").localeCompare(String(a.llegada||"")));
const svcOn=(k,d)=>{ const c=svcCfg(k); return (c.dias||[]).includes(pYmd(d).getDay()); };
function svcMissed(k,days=14){ const c=svcCfg(k); if(!(c.dias||[]).length) return [];
  const vs=new Set(visitas(k).map(v=>v.fecha)); const out=[]; const since=c.desde||"";
  for(let i=1;i<=days;i++){ const d=addD(TODAY(),-i); if(since&&d<since) break; if(svcOn(k,d)&&!vs.has(d)) out.push(d); } return out; }

function remRowP(r,d,late,done){ const p=P(r.resp);

<button class="chk lg ${done?"on":""}" data-act="remDone" data-id="${r.id}" data-d="${d}" aria-label="Hecho">${ic("check")}</button></div>`; }
function remRow(r,d,late){ const done=isDone(r,d);

  return `<div class="rrow ${done?"done":""}"><span class="ri">${ic(r.cat==="Pago"?"money":r.cat==="Cumpleaños"?"sun":"bell")}</span><div class="nm" data-act="openRem" data-id="${r.id}"><b>${esc(r.titulo)}</b><span>${late?`<span class="late-b">Vencido</span> `:""}${esc(relD(d))}${d!==TODAY()&&dayDiff(d,TODAY())<7&&dayDiff(d,TODAY())>1?" "+fmtD(d):""}${r.hora?" · "+esc(r.hora):""}${r.cat?" · "+esc(r.cat):""}${repeats(r)?" · "+esc(repLabel(r)):""}</span></div>
<button class="chk lg ${done?"on":""}" data-act="remDone" data-id="${r.id}" data-d="${d}" aria-label="Hecho">${ic("check")}</button></div>`; }

VIEWS.tareas=()=>{
  const ps=personal(); const cols=[...ps,null];
  const d=TODAY();
  const colItems=p=>{ const who=p?p.id:"";
    if(S.tv==="hoy") return instDay(d,who).concat(p?[]:tareas().filter(t=>t.resp&&!P(t.resp)).flatMap(t=>instDay(d,t.resp)));
    if(S.tv==="sem"){ const out=[]; for(let i=0;i<7;i++){ const dd=addD(d,i); (i===0?instDay(dd,who):tareas().filter(t=>(t.resp||"")===who&&occurs(t,dd)).map(t=>({t,d:dd}))).forEach(x=>out.push(x)); } return out; }
    return tareas().filter(t=>(t.resp||"")===who).map(t=>({t,d:repeats(t)?(nextOcc(t)||t.fecha):hechaKey(t)})).sort((a,b)=>isDone(a.t,a.d)-isDone(b.t,b.d)||String(a.d).localeCompare(String(b.d)));
  };
  return `<div class="phead"><div class="nm"><div class="eyebrow">${S.tv==="hoy"?esc(longD(d)):S.tv==="sem"?"Próximos 7 días":"Todas las tareas"}</div><h1>Tablero de tareas</h1></div>
${ps.some(p=>okTel(p.cel))?`<button class="btn wa-b" data-act="sendAll">${ic("chat")} Enviar a cada uno</button>`:""}
<div class="seg" role="group" aria-label="Ver">${[["hoy","Hoy"],["sem","Semana"],["todas","Todas"]].map(([k,n])=>`<button data-act="tv" data-v="${k}" aria-pressed="${S.tv===k}">${n}</button>`).join("")}</div></div>
${!ps.length?`<div class="banner">${ic("team")}<span>Cargá a tu personal para tener una columna por persona.</span><span class="sp"></span><button class="btn sm" data-act="newPersona">Agregar personal</button></div>`:""}
<div class="board">${cols.map(p=>{ const xs=colItems(p); const n=xs.filter(x=>!isDone(x.t,x.d)).length;
  if(!p&&!xs.length&&ps.length) return "";
  return `<section class="col"><div class="col-h">${avHTML(p)}<div class="who"><h3>${esc(p?p.nombre:"Sin asignar")}</h3><span class="sub">${p?esc(p.rol||"")+(worksOn(p,d)?" · viene hoy":""):"Tareas de la casa"}</span></div><span class="n">${n}</span>
${p&&okTel(p.cel)?`<a class="icon-btn wa" href="${esc(waHref(p.cel,waTasksText(p)))}" target="_blank" rel="noopener" data-act="waLog" data-id="${p.id}" aria-label="Mandar tareas de hoy por WhatsApp" title="Mandar tareas de hoy por WhatsApp">${ic("chat")}</a>`:""}</div>
<div class="col-list">${xs.length?xs.map(x=>card(x,{day:S.tv!=="hoy"})).join(""):`<div class="col-empty">${S.tv==="hoy"?"Nada para hoy":"Sin tareas"}</div>`}</div>
<div class="quick"><button data-act="newTask" data-resp="${p?p.id:""}">${ic("plus")} Agregar tarea</button></div></section>`; }).join("")}</div>`;
};

VIEWS.cal=()=>{ const {y,m,sel}=S.cal; const f=new Date(y,m,1); const start=new Date(y,m,1-((f.getDay()+6)%7)); const today=TODAY();
  const cells=[]; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(ymd(d)); }
  const AUS=all("ausencia"), PED=pedidos(), HI={}; all("hist").forEach(e=>{ const k=ymd(new Date(e.ts)); (HI[k]=HI[k]||[]).push(e); });
  const dayData=d=>{ const ts=tareas().filter(t=>occurs(t,d)).map(t=>({t,d})); const rs=remindersOn(d); const vs=Object.keys(SVC).filter(k=>svcOn(k,d)||visitas(k).some(v=>v.fecha===d));
    const au=AUS.filter(a=>a.desde<=d&&d<=(a.hasta||a.desde)&&P(a.persona)); const pe=PED.filter(x=>ymd(new Date(x.ts))===d); return {ts,rs,vs,au,pe,hi:(HI[d]||[]).sort((a,b)=>a.ts-b.ts)}; };
  const sd=dayData(sel);
  return `<div class="calbar"><button class="icon-btn" data-act="calM" data-n="-1" aria-label="Mes anterior">${ic("chevl")}</button><h2>${MES[m]} ${y}</h2><button class="icon-btn" data-act="calM" data-n="1" aria-label="Mes siguiente">${ic("chev")}</button><span class="sp"></span><button class="btn sm" data-act="calToday">Hoy</button></div>
<div class="cal">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x=>`<div class="dw">${x}</div>`).join("")}
${cells.map(d=>{ const dd=pYmd(d), x=dayData(d); const chips=[...x.ts.map(o=>`<div class="cc ${isDone(o.t,d)?"done":""}" style="--pc:var(--c${((P(o.t.resp)||{}).color||7)%NC})"><span>${esc(o.t.titulo)}</span></div>`),...x.rs.map(r=>`<div class="cc rem"><span>${esc(r.titulo)}</span></div>`),...x.vs.map(k=>`<div class="cc vis"><span>${SVC[k].n}</span></div>`),...x.pe.map(p=>`<div class="cc ped"><span>Pedido ${esc(p.nombre||"")}</span></div>`)];
  chips.unshift(...x.au.map(a=>`<div class="cc aus"><span>${esc(first(P(a.persona).nombre))}: ${esc(a.motivo||"ausente")}</span></div>`));
  const dots=[...x.ts.map(o=>`<i style="--pc:var(--c${((P(o.t.resp)||{}).color||7)%NC})"></i>`),...x.rs.map(()=>`<i class="rem"></i>`),...x.vs.map(()=>`<i class="vis"></i>`),...x.pe.map(()=>`<i class="ped"></i>`)]; dots.unshift(...x.au.map(()=>`<i class="aus"></i>`)); dots.splice(6);
  return `<div class="d ${dd.getMonth()!==m?"out":""} ${dd.getDay()%6===0?"we":""} ${d===today?"today":""} ${d===sel?"sel":""}" data-act="calSel" data-d="${d}"><span class="dn">${dd.getDate()}</span><div class="dchips">${chips.slice(0,3).join("")}${chips.length>3?`<span class="cmore">+${chips.length-3}</span>`:""}</div><div class="ddots">${dots.join("")}</div></div>`; }).join("")}</div>
<div class="daypanel"><div class="sec-h"><h2 style="text-transform:capitalize">${esc(longD(sel))}</h2><span class="sp"></span><button class="btn sm" data-act="newAus" data-d="${sel}">${ic("plus")} Ausencia</button><button class="btn sm" data-act="newTask" data-fecha="${sel}">${ic("plus")} Tarea</button></div>
${sd.au.length?`<div class="rlist">${sd.au.map(a=>{ const p=P(a.persona); return `<div class="alert warn" data-act="editAus" data-id="${a.id}" style="cursor:pointer">${avHTML(p)}<span><b>${esc(p.nombre)}</b> ausente: ${esc(a.motivo||"")}${a.hasta&&a.hasta!==a.desde?" · "+esc(ausTxt(a)):""}${a.nota?" · "+esc(a.nota):""}</span></div>`; }).join("")}</div>`:""}
${sd.ts.length?`<div class="daylist">${sd.ts.map(x=>card(x,{who:true})).join("")}</div>`:""}
${sd.rs.length?`<div class="rlist">${sd.rs.map(r=>remRow(r,sel)).join("")}</div>`:""}
${sd.vs.map(k=>{ const v=visitas(k).find(x=>x.fecha===sel); return `<div class="prow"><span class="pi">${ic(SVC[k].ic)}</span><div class="nm"><b>${SVC[k].n}</b><span>${v?"Visita registrada":"Día de visita"}</span></div>${v?`<button class="btn sm" data-act="openVisita" data-id="${v.id}">Ver</button>`:`<button class="btn sm" data-act="newVisita" data-k="${k}" data-d="${sel}">Registrar</button>`}</div>`; }).join("")}
${sd.pe.map(x=>{ const c=pedCount(x); return `<div class="prow" data-act="openPedido" data-id="${x.id}" style="cursor:pointer"><span class="pi">${ic("cart")}</span><div class="nm"><b>Pedido de ${esc(x.nombre||"compras")}</b><span>${hm(x.ts)} · ${c.ok} de ${c.n} comprados</span></div></div>`; }).join("")}
${!sd.ts.length&&!sd.rs.length&&!sd.vs.length&&!sd.au.length&&!sd.pe.length&&!sd.hi.length?`<p class="muted small" style="margin:0">Nada para este día.</p>`:""}
${sd.hi.length?`<div class="eyebrow" style="margin-top:6px">Lo que quedó registrado</div><div class="daylog">${sd.hi.map(histRow).join("")}</div>`:""}</div>`;
};

/* ---------- resumen y gráficos ---------- */
const svgW=420;
function barsV(data,{h=150,stack=[["v","var(--accent)"]],fmt=v=>v}={}){ // data: [{l,v...}]
  const n=data.length||1, max=Math.max(1,...data.map(d=>stack.reduce((t,[k])=>t+(+d[k]||0),0))), bw=svgW/n, pad=Math.min(6,bw*.2), ch=h-20;
  return `<svg class="chart" viewBox="0 0 ${svgW} ${h}" role="img">${[0.5,1].map(f=>`<line x1="0" x2="${svgW}" y1="${ch-ch*f}" y2="${ch-ch*f}" class="grid"/>`).join("")}
${data.map((d,i)=>{ let y=ch; return stack.map(([k,c])=>{ const v=+d[k]||0, hh=v/max*ch; y-=hh; return hh>0?`<rect x="${i*bw+pad}" y="${y}" width="${bw-2*pad}" height="${hh}" rx="2" fill="${c}"><title>${esc(d.l)}: ${fmt(v)}</title></rect>`:""; }).join("")+`<text x="${i*bw+bw/2}" y="${h-5}" text-anchor="middle">${esc(d.l)}</text>`; }).join("")}</svg>`; }
function barsH(rows,{color="var(--accent)",fmt=v=>v}={}){ const max=Math.max(1,...rows.map(r=>r.v));
  return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="hl">${esc(r.l)}</span><span class="ht"><i style="width:${Math.max(2,r.v/max*100)}%;background:${r.c||color}"></i></span><span class="hv">${esc(fmt(r.v))}</span></div>`).join("")}</div>`; }
function lineChart(pts,{h=140,band=null,min=0,max=1}={}){ if(pts.length<2) return `<p class="muted small" style="margin:0">Hacen falta al menos dos visitas con medición.</p>`;
  const ch=h-20, X=i=>16+i*(svgW-32)/(pts.length-1), Y=v=>ch-(v-min)/(max-min)*(ch-10)-5;
  return `<svg class="chart" viewBox="0 0 ${svgW} ${h}" role="img">${band?`<rect x="0" width="${svgW}" y="${Y(band[1])}" height="${Y(band[0])-Y(band[1])}" fill="var(--okbg)"/>`:""}
<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="${band&&(p.v<band[0]||p.v>band[1])?"var(--bad)":"var(--accent)"}"><title>${esc(p.l)}: ${p.v}</title></circle><text x="${X(i)}" y="${h-5}" text-anchor="middle">${esc(p.l)}</text>`).join("")}</svg>`; }
const donut=(pct,label)=>{ const r=34, c=2*Math.PI*r, p=Math.max(0,Math.min(100,pct));
  return `<svg viewBox="0 0 90 90" class="donut"><circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--line2)" stroke-width="10"/><circle cx="45" cy="45" r="${r}" fill="none" stroke="${p>=80?"var(--ok)":p>=50?"var(--warn)":"var(--bad)"}" stroke-width="10" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 45 45)" stroke-linecap="round"/><text x="45" y="50" text-anchor="middle" class="dv">${Math.round(p)}%</text></svg><span>${label}</span>`; };

VIEWS.resumen=()=>{ const {y,m}=S.res, today=TODAY(); const d0=ymd(new Date(y,m,1)), dN=ymd(new Date(y,m+1,0)); const fin=dN<today?dN:today; const mes=d0.slice(0,7);
  const days=[]; for(let d=d0; d<=fin; d=addD(d,1)) days.push(d);
  const ts=tareas(); const ps=personal();
  const perDay=days.map(d=>{ let ok=0,no=0; ts.forEach(t=>{ if(t.creada&&ymd(new Date(t.creada))>d) return; if(occurs(t,d)) (isDone(t,d)?ok++:no++); }); return {d,ok,no}; });
  ts.filter(t=>!repeats(t)&&!t.fecha&&(t.hechas||{}).x&&ymd(new Date(t.hechas.x.ts))>=d0&&ymd(new Date(t.hechas.x.ts))<=dN).forEach(t=>{ const k=ymd(new Date(t.hechas.x.ts)); const r=perDay.find(x=>x.d===k); if(r) r.ok++; });
  const okT=perDay.reduce((a,x)=>a+x.ok,0), noT=perDay.reduce((a,x)=>a+x.no,0), pct=okT+noT?okT/(okT+noT)*100:0;
  const ausM=all("ausencia").filter(a=>P(a.persona)); const ausDiasMes=p=>days.filter(d=>tocaVenir(p,d)&&ausenteOn(p.id,d)).length;
  const totAus=ps.reduce((t,p)=>t+ausDiasMes(p),0);
  const vis=visitas().filter(v=>v.fecha.startsWith(mes)); const gasto=vis.reduce((t,v)=>t+(+v.monto||0),0), debe=visitas().filter(v=>!v.pagado&&+v.monto>0).reduce((t,v)=>t+(+v.monto||0),0);
  const peds=pedidos().filter(x=>ymd(new Date(x.ts)).startsWith(mes));
  const remM=all("recordatorio").filter(r=>r.cat==="Pago"); let pagos=0; days.forEach(d=>remM.forEach(r=>{ if(occurs(r,d)) pagos++; }));
  // personas
  const rowsP=ps.map(p=>{ let ok=0,tot=0; days.forEach(d=>ts.forEach(t=>{ if(t.resp!==p.id||!occurs(t,d)) return; if(t.creada&&ymd(new Date(t.creada))>d) return; tot++; if(isDone(t,d)) ok++; }));
    const prog=days.filter(d=>tocaVenir(p,d)).length, au=ausDiasMes(p); return {p,ok,tot,prog,au}; });
  // gastos últimos 6 meses
  const g6=[]; for(let i=5;i>=0;i--){ const dd=new Date(y,m-i,1), k=ymd(dd).slice(0,7); const vs=visitas().filter(v=>v.fecha.startsWith(k)); g6.push({l:MES3[dd.getMonth()],jardin:vs.filter(v=>v.servicio==="jardin").reduce((t,v)=>t+(+v.monto||0),0),piscina:vs.filter(v=>v.servicio==="piscina").reduce((t,v)=>t+(+v.monto||0),0)}); }
  // productos más pedidos (todo el historial)
  const cnt={}; pedidos().forEach(x=>(x.items||[]).forEach(i=>{ const k=String(i.txt||"").trim(); if(k) cnt[k]=(cnt[k]||0)+1; }));
  all("lista").forEach(L=>Object.entries(L.frec||{}).forEach(([k,v])=>{ if(!cnt[k]||cnt[k]<v) cnt[k]=v; }));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v])=>({l,v}));
  const pool=visitas("piscina").filter(v=>v.ph||v.cloro).slice(0,10).reverse();
  const sp=perDay.length>16?perDay.slice(-16):perDay;
  return `<div class="calbar"><button class="icon-btn" data-act="resM" data-n="-1" aria-label="Mes anterior">${ic("chevl")}</button><h2>${MES[m]} ${y}</h2><button class="icon-btn" data-act="resM" data-n="1" aria-label="Mes siguiente">${ic("chev")}</button></div>
<div class="kv">
<div class="${pct>=80?"ok":pct>=50?"warn":"bad"}"><b>${Math.round(pct)}%</b><span>Tareas cumplidas</span></div>
<div><b>${okT}</b><span>Tareas hechas</span></div>
<div class="${totAus?"warn":""}"><b>${totAus}</b><span>Días de ausencia</span></div>
<div><b>Gs. ${gs(gasto)}</b><span>Jardín y piscina</span></div>
<div class="${debe?"bad":"ok"}"><b>Gs. ${gs(debe)}</b><span>Visitas sin pagar</span></div>
<div><b>${peds.length}</b><span>Pedidos de compras</span></div></div>
<div class="pgrid2">
<section class="panel"><div class="hd"><h2>${ic("check")} Tareas por día</h2></div>${days.length?barsV(sp.map(x=>({l:String(pYmd(x.d).getDate()),ok:x.ok,no:x.no})),{stack:[["ok","var(--ok)"],["no","var(--line)"]]}):`<p class="muted small" style="margin:0">Este mes todavía no empezó.</p>`}
<div class="legend"><span><i style="background:var(--ok)"></i>Hechas</span><span><i style="background:var(--line)"></i>Sin hacer</span></div></section>
<section class="panel"><div class="hd"><h2>${ic("team")} Cumplimiento por persona</h2></div>
${rowsP.length?`<div class="donuts">${rowsP.map(r=>`<div class="dnut">${donut(r.tot?r.ok/r.tot*100:0,esc(first(r.p.nombre)))}</div>`).join("")}</div>
<table class="rtab"><thead><tr><th>Persona</th><th>Tareas</th><th>Días</th><th>Ausente</th></tr></thead><tbody>${rowsP.map(r=>`<tr><td>${avHTML(r.p)} ${esc(first(r.p.nombre))}</td><td>${r.ok}/${r.tot}</td><td>${r.prog-r.au}/${r.prog}</td><td class="${r.au?"bad":""}">${r.au}</td></tr>`).join("")}</tbody></table>`:`<p class="muted small" style="margin:0">Cargá a tu personal para ver esto.</p>`}</section>
<section class="panel"><div class="hd"><h2>${ic("money")} Gastos de jardín y piscina</h2></div>${barsV(g6,{stack:[["jardin","var(--c4)"],["piscina","var(--c6)"]],fmt:v=>"Gs. "+gs(v)})}
<div class="legend"><span><i style="background:var(--c4)"></i>Jardín</span><span><i style="background:var(--c6)"></i>Piscina</span><span class="sp"></span><span>Total 6 meses: <b>Gs. ${gs(g6.reduce((t,x)=>t+x.jardin+x.piscina,0))}</b></span></div></section>
<section class="panel"><div class="hd"><h2>${ic("cart")} Lo que más se compra</h2></div>${top.length?barsH(top,{fmt:v=>v+"×"}):`<p class="muted small" style="margin:0">Todavía no hay pedidos.</p>`}</section>
<section class="panel"><div class="hd"><h2>${ic("pool")} Piscina: pH</h2></div>${lineChart(pool.filter(v=>v.ph).map(v=>({l:fmtD(v.fecha),v:+v.ph})),{band:PH,min:6.6,max:8.4})}<p class="muted small" style="margin:0">La franja verde es el rango ideal (${PH[0]}–${PH[1]}).</p></section>
<section class="panel"><div class="hd"><h2>${ic("drop")} Piscina: cloro</h2></div>${lineChart(pool.filter(v=>v.cloro).map(v=>({l:fmtD(v.fecha),v:+v.cloro})),{band:CL,min:0,max:5})}<p class="muted small" style="margin:0">Rango ideal ${CL[0]}–${CL[1]} ppm.</p></section>
${ausM.length?`<section class="panel"><div class="hd"><h2>${ic("cal")} Ausencias por motivo (todo el año)</h2></div>${barsH(MOTIVOS.map(mo=>({l:mo,v:ausM.filter(a=>a.motivo===mo&&a.desde.startsWith(String(y))).reduce((t,a)=>t+ausDias(a),0),c:"var(--bad)"})).filter(r=>r.v),{fmt:v=>v+" d"})}</section>`:""}
</div>`;
};

  const g={}; h.forEach(e=>{ const k=ymd(new Date(e.ts)); (g[k]=g[k]||[]).push(e); });
  return Object.entries(g).map(([d,es])=>`<div class="hgroup"><h3>${esc(relD(d)==="Hoy"||relD(d)==="Ayer"?relD(d)+" · "+longD(d):longD(d))}</h3>${es.map(histRow).join("")}</div>`).join("");

      if(o.servicio==="piscina"&&((o.ph&&(+o.ph<PH[0]||+o.ph>PH[1]))||(o.cloro&&(+o.cloro<CL[0]||+o.cloro>CL[1])))) toast("Ojo: el pH o el cloro quedaron fuera del rango ideal.");

function remModal(id){
  const r=id?S.items[id]:{titulo:"",fecha:TODAY(),hora:"09:00",rep:"mes",cat:"Pago",nota:""};
  modal(`${mHead(id?"Recordatorio":"Nuevo recordatorio")}<form class="sheet-b" id="fRem">
<label class="fld"><span>Qué recordar</span><input class="inp" name="titulo" required maxlength="140" value="${esc(r.titulo)}" placeholder="Ej. Pagar la ANDE" ${id?"":"autofocus"}></label>
<div class="g2"><label class="fld"><span>Fecha</span><input class="inp" type="date" name="fecha" required value="${esc(r.fecha)}"></label><label class="fld"><span>Hora</span><input class="inp" type="time" name="hora" value="${esc(r.hora||"")}"></label></div>
<div class="g2"><label class="fld"><span>Repetir</span><select class="inp" name="rep">${Object.entries(REP_R).map(([k,n])=>`<option value="${k}" ${r.rep===k?"selected":""}>${n}</option>`).join("")}</select></label>
<label class="fld"><span>Tipo</span><select class="inp" name="cat">${CATS.map(c=>`<option ${c===r.cat?"selected":""}>${c}</option>`).join("")}</select></label></div>
<label class="fld"><span>Para</span><select class="inp" name="resp">${persOpts(r.resp,"Para mí / la casa")}</select><small class="muted">Si es para alguien del personal, lo ve en su enlace y lo agrega a su calendario para que le avise en el celular.</small></label>
<label class="fld"><span>Notas</span><textarea class="inp" name="nota" rows="2" maxlength="600" placeholder="Número de cliente, a quién llamar…">${esc(r.nota||"")}</textarea></label>
<div class="row"><button class="btn pri" type="submit">${id?"Guardar":"Crear"}</button>${id?`<button class="btn" type="button" id="rIcs">${ic("cal")} Agregar a mi calendario</button>`:""}${id&&P(r.resp)&&okTel(P(r.resp).cel)?`<a class="btn wa-b" href="${esc(waHref(P(r.resp).cel,waRem(r)))}" target="_blank" rel="noopener">${ic("chat")} Avisar a ${esc(first(P(r.resp).nombre))}</a>`:""}<span class="sp"></span>${id?`<button class="btn danger ghost" type="button" id="rDel">${ic("trash")} Eliminar</button>`:""}</div></form>`,"narrow");
  const f=$("#fRem");
  f.onsubmit=e=>{ e.preventDefault(); const o={...r,titulo:f.titulo.value.trim(),fecha:f.fecha.value,hora:f.hora.value,rep:f.rep.value,cat:f.cat.value,resp:f.resp.value,nota:f.nota.value.trim()}; if(!o.titulo||!o.fecha) return;
    if(o.rep==="sem") o.dias=[pYmd(o.fecha).getDay()];
    if(!id){ o.id=rid(); o.tipo="recordatorio"; o.hechas={}; put(o); const pp=P(o.resp); log(`creó el recordatorio «${o.titulo}»${pp?" para "+first(pp.nombre):""}`,"new",o.id); closeModal();
      if(pp&&okTel(pp.cel)) toast(`Recordatorio creado para ${first(pp.nombre)}.`,{label:"Avisarle por WhatsApp",href:waHref(pp.cel,waRem(o))}); else toast("Recordatorio creado.",{label:"Agregar a mi calendario",fn:()=>downloadIcs(o)}); return; }
    put(o); closeModal(); };
  const ib=$("#rIcs"); if(ib) ib.onclick=()=>downloadIcs(r);
  const db=$("#rDel"); if(db) db.onclick=()=>confirmDel(db,()=>{ del(id); closeModal(); });
}
const waRem=r=>{ const p=P(r.resp); return `¡Hola ${p?first(p.nombre):""}! Te dejo un recordatorio: «${r.titulo}» ${r.rep&&r.rep!=="no"?"("+REP_R[r.rep].toLowerCase()+", desde el "+longD(r.fecha)+")":"para el "+longD(r.fecha)}${r.hora?" a las "+r.hora:""}.${r.nota?"\n"+r.nota:""}${live()&&p&&p.token?`\n\nEn tu enlace lo podés agregar a tu calendario para que te avise en el celular: ${staffLink(p)}`:""}`; };
function sendAllModal(){ const d=TODAY(); const ps=personal().filter(p=>okTel(p.cel));
  modal(`${mHead("Enviar las tareas a cada uno")}<div class="sheet-b"><p class="muted small" style="margin:0">Tocá cada persona: se abre WhatsApp con sus tareas de hoy${live()?" y su enlace para marcarlas":""}. Al volver, tocá la siguiente.</p>
<div class="plist">${ps.map(p=>{ const n=instDay(d,p.id).filter(x=>!isDone(x.t,x.d)).length; const r=remindersOn(d).filter(x=>x.resp===p.id).length;
  return `<a class="pick" href="${esc(waHref(p.cel,waTasksText(p)))}" target="_blank" rel="noopener" data-act="sentOne" data-id="${p.id}">${avHTML(p)}<span style="flex:1">${esc(p.nombre)}<br><span class="muted small">${n} tarea${n===1?"":"s"}${r?" · "+r+" recordatorio"+(r===1?"":"s"):""}${worksOn(p,d)?"":" · hoy no viene"}</span></span><span class="wa">${ic("chat")}</span></a>`; }).join("")}</div></div>`,"narrow"); }
function downloadIcs(r){ const dt=r.fecha.replace(/-/g,""); const tm=r.hora?r.hora.replace(":","")+"00":"";
  const rr={sem:"FREQ=WEEKLY",mes:"FREQ=MONTHLY",anio:"FREQ=YEARLY"}[r.rep];
  const e=s=>String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const end=tm?"":ymd(new Date(pYmd(r.fecha).getTime()+864e5)).replace(/-/g,"");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Casa//ES","BEGIN:VEVENT","UID:"+r.id+"@casa","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    tm?"DTSTART:"+dt+"T"+tm:"DTSTART;VALUE=DATE:"+dt, tm?"DURATION:PT30M":"DTEND;VALUE=DATE:"+end, rr?"RRULE:"+rr:"", "SUMMARY:"+e(r.titulo), r.nota?"DESCRIPTION:"+e(r.nota):"",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e(r.titulo),"TRIGGER:"+(tm?"-PT0M":"PT9H"),"END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean);
  const blob=new Blob([lines.join("\r\n")],{type:"text/calendar"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(r.titulo||"recordatorio").replace(/[^\wáéíóúñ ]+/gi,"").slice(0,40)+".ics"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

<div class="g2"><label class="fld"><span>Cantidad</span><input class="inp" name="cant" value="${esc(c.cant||"")}" maxlength="20"></label><label class="fld"><span>Lista</span><select class="inp" name="lista">${listas().map(l=>`<option value="${l.id}" ${l.id===c.lista?"selected":""}>${esc(l.nombre)}</option>`).join("")}</select></label></div>
<div class="row"><button class="btn pri" type="submit">Guardar</button><span class="sp"></span><button class="btn danger ghost" type="button" id="iDel">${ic("trash")} Quitar</button></div></form>`,"narrow");

const ACT={
  go:el=>go(el.dataset.v),
  more:()=>modal(`${mHead("Más")}<div class="sheet-b"><div class="more-sheet">${[["cal","Calendario","cal"],["recordatorios","Recordatorios","bell"],["personal","Personal","team"],["resumen","Resumen y gráficos","chart"],["hist","Historial","hist"],["ajustes","Ajustes","gear"]].map(([k,n,i])=>`<button data-act="goClose" data-v="${k}">${ic(i)} ${n}</button>`).join("")}</div></div>`,"narrow"),
  goClose:el=>{ $("#layer").innerHTML=""; go(el.dataset.v); },
  close:()=>closeModal(),
  newTask:el=>taskModal(null,{resp:el.dataset.resp,fecha:el.dataset.fecha}),
  openTask:(el,e)=>{ if(e.target.closest("[data-act=done]")) return; taskModal(el.dataset.id); },
  done:(el,e)=>{ e.stopPropagation(); toggleDone(el.dataset.id,el.dataset.d); S.keepScroll=true; },
  tv:el=>{ S.tv=el.dataset.v; ls.set("casa.tv",S.tv); render(); },
  newPersona:()=>personaModal(null),
  editPersona:el=>personaModal(el.dataset.id),
  waLog:el=>{ const p=P(el.dataset.id); if(p) log(`le mandó por WhatsApp sus tareas a ${first(p.nombre)}`,"wa",p.id); },
  copyLink:async el=>{ const p=P(el.dataset.id); if(!p) return; const u=staffLink(p);
    try{ await navigator.clipboard.writeText(u); toast(`Enlace de ${first(p.nombre)} copiado.`,okTel(p.cel)?{label:"Mandarlo por WhatsApp",href:waHref(p.cel,`¡Hola ${first(p.nombre)}! Acá ves tus tareas de la casa y las podés marcar cuando las termines: ${u}`)}:null); }
    catch(e){ prompt("Enlace personal:",u); } },
  newRem:()=>remModal(null), openRem:el=>remModal(el.dataset.id),
  remDone:el=>{ const r=S.items[el.dataset.id]; if(!r) return; const h={...(r.hechas||{})}; const d=el.dataset.d; if(h[d]) delete h[d]; else { h[d]={ts:Date.now(),por:S.myName}; log(`marcó hecho el recordatorio «${r.titulo}»`,"done",r.id); } put({...r,hechas:h}); S.keepScroll=true; },
  newVisita:el=>visitaModal(null,el.dataset.k||"jardin",el.dataset.d),
  openVisita:(el,e)=>{ if(e.target.closest("[data-act=pay]")) return; visitaModal(el.dataset.id); },
  pay:(el,e)=>{ e.stopPropagation(); const v=S.items[el.dataset.id]; if(!v) return; put({...v,pagado:!v.pagado}); if(!v.pagado) log(`marcó pagada la visita de ${SVC[v.servicio].n.toLowerCase()} del ${fmtD(v.fecha)} (Gs. ${gs(v.monto)})`,"pay",v.id); S.keepScroll=true; },
  svcCfg:el=>svcModal(el.dataset.k),
  initListas:()=>{ LISTAS0.forEach((n,i)=>put({id:rid(),tipo:"lista",nombre:n,orden:i,frec:{}})); },
  lista:el=>{ S.lista=el.dataset.id; render(); },
  newLista:()=>listaModal(null), editLista:()=>listaModal(S.lista),
  itOk:el=>{ const c=S.items[el.dataset.id]; if(c){ put({...c,ok:!c.ok}); syncPedidos(c.id,!c.ok); S.keepScroll=true; } },
  editItem:el=>itemModal(el.dataset.id),
  reOk:()=>{ const its=all("compra").filter(c=>c.lista===S.lista&&c.ok); its.forEach(c=>put({...c,ok:false})); toast(`Volvieron a la lista ${its.length} producto${its.length===1?"":"s"}.`); },
  pedido:el=>{ const L=S.items[S.lista]; if(!L) return; nuevoPedido(L,P(el.dataset.pid)); setTimeout(closeModal,300); toast("Pedido guardado."); },
  openPedido:el=>pedidoModal(el.dataset.id),
  pedIt:el=>{ const x=S.items[el.dataset.id]; if(!x) return; const its=(x.items||[]).map((it,i)=>i===+el.dataset.i?{...it,ok:!it.ok}:it); const it=its[+el.dataset.i];
    const cerrado=its.every(i=>i.ok); put({...x,items:its,cerrado,cerradoTs:cerrado?(x.cerradoTs||Date.now()):null});
    const c=S.items[it.id]; if(c&&c.tipo==="compra") put({...c,ok:it.ok}); pedidoModal(x.id); },
  invite:()=>inviteModal(),
  sendAll:()=>sendAllModal(),
  sentOne:el=>{ const p=P(el.dataset.id); if(p){ log(`le mandó por WhatsApp sus tareas a ${first(p.nombre)}`,"wa",p.id); el.style.opacity=".5"; } },
  copyInv:async el=>{ const p=S.items[el.dataset.id]; if(!p) return; try{ await navigator.clipboard.writeText(invLink(p)); toast("Enlace copiado."); }catch(e){ prompt("Enlace:",invLink(p)); } },
  pendDel:el=>{ const p=S.items[el.dataset.id]; if(p) del(p.id); },
  newAus:el=>ausModal(null,{persona:el.dataset.id||"",desde:el.dataset.d||(S.view==="cal"?S.cal.sel:TODAY())}),
  editAus:el=>ausModal(el.dataset.id),
  ausList:el=>ausListModal(el.dataset.id),
  frec:el=>addItem(el.dataset.t,""),
  newItemFocus:()=>{ if(S.view!=="compras") go("compras"); setTimeout(()=>{ const i=$("#itTxt"); i&&i.focus(); },50); },
  shareLista:()=>shareListaModal(),
  calM:el=>{ let {y,m}=S.cal; m+=+el.dataset.n; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.cal={...S.cal,y,m}; render(); },
  resM:el=>{ let {y,m}=S.res; m+=+el.dataset.n; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.res={y,m}; render(); },
  calToday:()=>{ S.cal={y:now.getFullYear(),m:now.getMonth(),sel:TODAY()}; render(); },
  calSel:el=>{ S.cal.sel=el.dataset.d; S.keepScroll=true; render(); },
  theme:el=>{ const v=el.dataset.v; if(v==="auto"){ ls.del("casa.theme"); document.documentElement.removeAttribute("data-theme"); } else { ls.set("casa.theme",v); document.documentElement.setAttribute("data-theme",v); } render(); },
  notifPerm:async()=>{ if(!("Notification" in window)) return toast("Este navegador no permite avisos. Usá «Agregar a mi calendario» en cada recordatorio.");
    const r=await Notification.requestPermission(); toast(r==="granted"?"Avisos activados en este celular.":"El celular bloqueó los avisos. Podés habilitarlos en los ajustes del navegador."); render(); },
  export:()=>{ const blob=new Blob([JSON.stringify({app:"casa",v:1,hogar:S.hogar,items:S.items},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="casa-copia-"+TODAY()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); },
  seed:()=>{ seed(); toast("Listo: cargué datos de ejemplo para que la pruebes."); go("home"); },
  wipe:el=>confirmDel(el,()=>{ S.items={}; saveLocal(); toast("Se borraron todos los datos de este celular."); go("home"); }),
  toLogin:()=>{ S.mode="boot"; ls.del("casa.modo"); showLogin(); },
  autDel:async el=>{ const {error}=await sb.rpc("casa_desautorizar",{p_email:el.dataset.e}); if(error) return onErr(error); toast(`${el.dataset.e} ya no puede entrar.`); loadAut(); },
  autCopy:async()=>{ try{ await navigator.clipboard.writeText(APP_URL); toast("Enlace copiado."); }catch(e){ prompt("Enlace:",APP_URL); } },
  logout:async()=>{ await sb.auth.signOut(); location.hash=""; location.reload(); },
  uploadLocal:async el=>{ try{ const j=JSON.parse(ls.get(LOCAL_KEY)||"null"); if(!j) return; el.disabled=true; const xs=Object.values(j.items).filter(x=>x.tipo!=="hist");
    xs.forEach(x=>{ if(x.tipo==="personal"&&!x.token) x.token=tok(); S.items[x.id]=x; });
    const {error}=await sb.from("casa_items").upsert(xs.map(toRow)); if(error) throw error; ls.set(LOCAL_KEY+".subido",ls.get(LOCAL_KEY)); ls.del(LOCAL_KEY); toast(`Se subieron ${xs.length} datos.`); render(); }catch(e){ el.disabled=false; onErr(e); } }
};
function syncPedidos(cid,ok){ pedidos().filter(x=>!x.cerrado&&(x.items||[]).some(i=>i.id===cid)).forEach(x=>{ const its=x.items.map(i=>i.id===cid?{...i,ok}:i); const cerrado=its.every(i=>i.ok); put({...x,items:its,cerrado,cerradoTs:cerrado?Date.now():null}); }); }
function addItem(txt,cant){ txt=String(txt||"").trim(); if(!txt||!S.lista) return; const L=S.items[S.lista];
  const dup=all("compra").find(c=>c.lista===L.id&&!c.ok&&c.txt.toLowerCase()===txt.toLowerCase());
  if(dup){ if(cant) put({...dup,cant}); toast(`«${txt}» ya está en la lista.`); return; }
  put({id:rid(),tipo:"compra",lista:L.id,txt,cant,ok:false,orden:Date.now()});
  const fr={...(L.frec||{})}; const k=Object.keys(fr).find(x=>x.toLowerCase()===txt.toLowerCase())||txt; fr[k]=(fr[k]||0)+1; put({...L,frec:fr}); S.keepScroll=true; }

document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="scrim"){ if(e.target===el) closeModal(); return; }
  const f=ACT[el.dataset.act]; if(!f) return;
  if(el.tagName==="A"&&el.href){ f(el,e); return; } if(el.tagName!=="LABEL") e.preventDefault(); f(el,e); });
document.addEventListener("submit",e=>{
  if(e.target.id==="addItem"){ e.preventDefault(); addItem($("#itTxt").value,$("#itCant").value); setTimeout(()=>{ const i=$("#itTxt"); if(i){ i.value=""; i.focus(); } },30); }
  if(e.target.id==="fCasa"){ e.preventDefault(); const f=e.target; S.myName=f.yo.value.trim(); ls.set("casa.yo",S.myName);
    S.hogar={...S.hogar,nombre:f.nombre.value.trim()||"Mi casa",pais:String(f.pais.value).replace(/\D/g,"")||"595"}; saveLocal();
    if(live()){ sb.from("casa_hogares").update({nombre:S.hogar.nombre,pais:S.hogar.pais}).eq("id",S.hogar.id).then(({error})=>error&&onErr(error));
      sb.from("casa_miembros").update({nombre:S.myName}).eq("hogar_id",S.hogar.id).eq("user_id",S.uid).then(()=>loadMiembros()); }
    toast("Guardado."); render(); }
  if(e.target.id==="fAut"){ e.preventDefault(); const f=e.target, em=f.email.value.trim().toLowerCase(); if(!okMail(em)) return;
    sb.rpc("casa_autorizar",{p_email:em,p_nota:f.nota.value.trim()}).then(({data,error})=>{ if(error||!data) return onErr(error||{}); f.reset(); toast(`Listo: ${em} ya puede entrar. Mandale el enlace por WhatsApp desde la lista.`); loadAut(); }); }
  if(e.target.id==="fInv"){ e.preventDefault(); const em=e.target.email.value.trim().toLowerCase(); if(!okMail(em)) return;

/* ---------- avisos con la app abierta ---------- */
function tickAvisos(){ if(S.mode!=="local"&&S.mode!=="live") return; const d=TODAY(), t=hm(Date.now());
  let seen={}; try{ seen=JSON.parse(ls.get("casa.avisados")||"{}"); }catch(e){}
  const due=[...remindersOn(d).filter(r=>r.hora&&r.hora<=t&&!isDone(r,d)).map(r=>({k:r.id+d,ti:r.titulo,b:"Recordatorio"+(r.hora?" · "+r.hora:"")})),
    ...tareas().filter(x=>x.hora&&occurs(x,d)&&x.hora<=t&&!isDone(x,d)).map(x=>({k:x.id+d,ti:x.titulo,b:"Tarea"+(P(x.resp)?" de "+first(P(x.resp).nombre):"")+" · "+x.hora}))].filter(x=>!seen[x.k]);
  if(!due.length) return;
  due.forEach(x=>{ seen[x.k]=1; try{ if("Notification" in window&&Notification.permission==="granted") new Notification(x.ti,{body:x.b,icon:"icon-192.png",tag:x.k}); }catch(e){} });
  toast(due.length===1?`${due[0].b}: ${due[0].ti}`:`${due.length} avisos: ${due.map(x=>x.ti).join(", ")}`);
  const keep={}; Object.keys(seen).filter(k=>k.endsWith(d)).forEach(k=>keep[k]=1); ls.set("casa.avisados",JSON.stringify(keep)); }
setInterval(tickAvisos,60000);

let syncing=false; async function resync(){ if(syncing||!live()) return; syncing=true; try{ if(await loadAll()) render(); } finally{ syncing=false; } }
function subscribe(){ if(S.ch) sb.removeChannel(S.ch);
  S.ch=sb.channel("casa-"+S.hogar.id).on("postgres_changes",{event:"*",schema:"public",table:"casa_items",filter:"hogar_id=eq."+S.hogar.id},p=>{
    if(p.eventType==="DELETE"){ if(p.old&&p.old.id) delete S.items[p.old.id]; }
    else { const r=p.new; const cur=S.items[r.id]; if(!cur||!cur.u||!r.datos.u||r.datos.u>=cur.u) S.items[r.id]={...r.datos,id:r.id,tipo:r.tipo}; }
    if(!$("#layer").innerHTML) scheduleRender(); }).subscribe(); }
async function startSession(session){
  S.session=session; S.uid=session.user.id; S.myEmail=(session.user.email||"").toLowerCase();
  loginBody(`<p>Entrando…</p>`);
  const est=await sb.rpc("casa_estado"); if(est.error&&!/function|schema|exist|not find/i.test(est.error.message||"")){ console.warn(est.error); return showLogin("No se pudo conectar. Revisá la conexión y volvé a intentar."); }
  S.admin=!!(est.data&&est.data.admin); if(est.data&&!est.data.autorizado) return noAuth();
  const {data,error}=await sb.rpc("casa_entrar");
  if(error){ console.warn(error); return /function|schema|exist|not find/i.test(error.message||"")?noDb():showLogin("No se pudo conectar. Revisá la conexión y volvé a intentar."); }
  if(!data||!data.length) return newHogar();
  const want=ls.get("casa.hogar"); const h=data.find(x=>x.id===want)||data[0]; S.hogar={id:h.id,nombre:h.nombre,pais:h.pais||"595"}; ls.set("casa.hogar",h.id);
  S.myName=ls.get("casa.yo")||"";
  if(!await loadAll()) return showLogin("No se pudo leer los datos. Volvé a intentar.");
  await loadMiembros();
  // si la persona usaba Casa sin cuenta y la casa en línea está vacía, se sube sola
  S.mode="live"; ls.set("casa.modo","live"); $("#login").hidden=true;
  Object.values(S.items).forEach(p=>{ if(p.tipo==="personal"&&!p.token) put({...p,token:tok()}); });
  render(); subscribe(); setTimeout(tickAvisos,1500);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&live()) resync(); });
}

async function boot(){
  try{ const t=ls.get("casa.theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
  S.view=ls.get("casa.view")||"home"; S.tv=ls.get("casa.tv")||"hoy";
  if(window.supabase&&SUPA_URL) sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:"casa.auth",persistSession:true}});
  const m=location.hash.match(/^#p=([0-9a-f]{16,64})$/); if(m) return staffView(m[1]);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!sb) return startLocal();
  const {data}=await sb.auth.getSession(); if(data&&data.session) return startSession(data.session);
  showLogin();
}
window.addEventListener("hashchange",()=>{ if(/^#p=/.test(location.hash)) location.reload(); });
boot();
})();
</script>
